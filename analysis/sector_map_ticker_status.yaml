# Lifecycle markers for tickers in analysis/sector_map_data.yaml.
#
# Kept out of sector_map_data.yaml on purpose: analysis/panel_insider_density.py
# pins that file by sha256 (pre-registration vs1-insider-density-v1) and refuses
# to run if a byte changes. The map itself stays as registered; old symbols stay
# in it, so historical panels keep every actor (dropping dead names would add
# survivorship bias). This file only tells the price list what to fetch today.
#
# Keys are tickers exactly as sector_map_data.yaml spells them.
#   status: renamed          same issuer, now priced under `successor`
#                            (ticker change, rebrand, Tiingo's share-class spelling)
#           acquired         absorbed by `acquirer` (a ticker, or a name if private)
#           delisted         no longer listed; nothing to price
#           foreign_listing  a non-US listing Tiingo's US equity endpoint cannot serve
#   last_session: last close Tiingo holds (its /tiingo/daily/{t} endDate)
#
# Instrument classes (^ indices, -USD crypto, =F futures, ATD.TO-style exchange
# suffixes) are not listed here: ingestion.tiingo_pull.is_tiingo_equity drops
# them by rule.
#
# Verified 2026-11-09 against Tiingo meta/search (the renamed successors carry
# the old symbol's history; the old symbol returns empty meta) and the
# 2026-11-06 session's stale list.

