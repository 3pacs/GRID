  # ── not in the sector map (added 2026-11-23) ────────────────────────────────
  # Symbols Tiingo stopped serving that reach the routine price list from the
  # oracle, hypothesis or insider-buyer universes (2026-11-10..23: each kept the
  # Tiingo price run PARTIAL for days). Both issuers' shares moved to the OTC
  # market under another symbol after a bankruptcy filing. The owner decided on
  # 2026-11-23 not to follow those symbols, so the entries are `delisted` and
  # the OTC symbol is kept in the note only. Where Tiingo's listing gives no
  # end date, no last_session is written.
  GWHT:
    status: delisted
    note: 'ESS Tech ceased operations and filed a voluntary Chapter 7 petition in the US Bankruptcy Court for the District of Delaware on 2026-11-13 (ESS Tech Form 8-K, Item 1.03, dated 2026-11-13, sec.gov/Archives/edgar/data/1819438/000181943826000091/wk-20261113.htm; its cover lists GWHT). Tiingo no longer finds GWHT (read 2026-11-23): the vendor gives no end date, so no last_session is written and no venue date is inferred from that. Last GWHT close GRID stored from Tiingo is 2026-11-13. Not followed (owner, 2026-11-23): Tiingo lists the OTC shares as GWHTQ, ESS Tech Inc (OTCMKTS), history from 2021-01-04'
  KPTI:
    status: delisted
    last_session: 2026-11-10
    note: 'Nasdaq suspended trading in the common stock at the opening of business on 2026-11-11; it is expected to trade over the counter as KPTIQ (Karyopharm Form 8-K, Item 3.01, event date 2026-11-04, sec.gov/Archives/edgar/data/1503802/000119312526448516/d122780d8k.htm). last_session is the endDate of Tiingo''s KPTI listing (read 2026-11-23): a vendor cutoff, the session before that suspension. Not followed (owner, 2026-11-23): Tiingo lists the OTC shares as KPTIQ, Karyopharm Therapeutics Inc (OTCMKTS), history from 2013-11-06; that vendor history is not verified point-in-time continuity'
