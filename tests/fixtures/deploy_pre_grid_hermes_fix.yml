# Static, checked-in fixture representing the SHAPE of .github/workflows/deploy.yml
# before grid-hermes got a restart/verify step at all (i.e. the actual state of
# main before #487/#490). This is NOT read from git history (see
# tests/test_deploy_restarts_hermes.py::test_guard_fails_against_the_pre_fix_workflow
# for why `git show HEAD~1` is fragile -- exactly the same reasoning that already
# moved the equivalent grid-realtime guard onto a fixture file in
# tests/fixtures/deploy_pre_grid_realtime_fix.yml, which this mirrors) -- it's a
# small, hand-written, permanently-stable snippet with just enough real structure
# (a couple of other services' steps) to exercise _step_named()'s lookup
# correctly, deliberately omitting any "restart grid-hermes" / "verify grid-hermes"
# step. It should never need to change again: its only job is to be "the
# known-bad shape the guard must catch", not to track deploy.yml's actual
# current content.
jobs:
  deploy:
    steps:
      - name: Build release tree
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" HEAD
          cd pwa && npm ci && npm run build && cd ..

      - name: Restart grid-api
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          sudo systemctl restart grid-api

      - name: Verify running API (health + OpenAPI)
        run: |
          curl -fsS http://localhost:8000/api/v1/system/health

      # No grid-hermes restart/verify step at all -- this is the actual
      # regression these guards exist to catch (#487/#490 shipped green and
      # sat inert for exactly this reason).

      - name: Restart grid-scheduler (activate_scheduler only)
        if: ${{ inputs.activate_scheduler == true }}
        run: |
          sudo systemctl restart grid-scheduler

      - name: Notify success
        if: success()
        run: echo "Deployment successful"
