# /etc/systemd/system/grid-options-puller.service.d/99-grid652-quarantine.conf
# Quarantine stays in force: the unit never starts by hand, and never
# starts at all unless the operator-created activation marker exists.
# Kill switch: remove the marker (or disable the timer).
[Unit]
RefuseManualStart=yes
ConditionPathExists=/data/grid_v4/gem_daily/ACTIVATED
