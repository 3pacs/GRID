# /etc/systemd/system/grid-options-puller.timer.d/50-gem-daily.conf
# Arms the event-triggered GEM runner once per weekday at 09:31 New York
# (13:31 UTC in EDT, 14:31 UTC in EST). The runner then follows the
# grid-scheduler journal and starts the capture within seconds of the
# scheduler's own "Options daily pull complete" line (same invocation), or
# records a SKIP if that has not happened by 10:05 New York. It still gates on
# the NYSE calendar and a single same-day claim.
# Replaces the legacy hourly UTC list; no catch-up runs after downtime.
[Timer]
OnCalendar=
OnCalendar=Mon..Fri *-*-* 09:31:00 America/New_York
Persistent=false
RandomizedDelaySec=0
AccuracySec=1s
