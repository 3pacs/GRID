# /etc/systemd/system/grid-options-puller.timer.d/50-gem-daily.conf
# One weekday firing at 10:05 New York (14:05 UTC in EDT, 15:05 UTC in EST),
# after the scheduler's own 13:30 UTC options pull. The runner still gates on
# the NYSE calendar, the scheduler journal and a single same-day claim.
# Replaces the legacy hourly UTC list; no catch-up runs after downtime.
[Timer]
OnCalendar=
OnCalendar=Mon..Fri *-*-* 10:05:00 America/New_York
Persistent=false
RandomizedDelaySec=0
AccuracySec=1s
