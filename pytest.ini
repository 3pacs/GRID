[pytest]
testpaths =
    tests
markers =
    unit: fast tests that do not require live services
    integration: tests that require a live PostgreSQL or external service
    slow: tests that take more than 10 seconds
filterwarnings =
    ignore:.*'oneOf' deprecated.*:Warning:matplotlib\._fontconfig_pattern
    ignore:.*'parseString' deprecated.*:Warning:matplotlib\._fontconfig_pattern
    ignore:.*'resetCache' deprecated.*:Warning:matplotlib\._fontconfig_pattern
    ignore:.*'enablePackrat' deprecated.*:Warning:matplotlib\._mathtext
    ignore:Could not find the number of physical cores.*:UserWarning:joblib\.externals\.loky\.backend\.context
