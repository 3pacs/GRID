# Tier: llm-large (Nemotron-Super-49B, Q5_K_M GGUF, GPU+CPU split)
# Resident set is dominated by the GGUF mmap + KV cache + CUDA scratch.
# Cap is generous — this is the primary inference path.
[Service]
Slice=grid.slice
MemoryAccounting=yes
MemoryHigh=40G
MemoryMax=48G
TasksMax=4096
OOMScoreAdjust=200
