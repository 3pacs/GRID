name: TEMP - validate actions/setup-node on grid-svr

# Throwaway, workflow_dispatch-only validation for the Node pin in
# deploy.yml (see ci/pin-node-22.23.2). Exercises the REAL actions/setup-node
# GitHub Action against the real [self-hosted, grid-svr] runner label --
# permissions, $GITHUB_PATH propagation across steps, and working-directory
# behavior -- which a manual `tar -xJf` extraction into /tmp cannot prove
# (that only proves the Node binary itself runs, not that setup-node's own
# tool-cache/PATH mechanism behaves correctly on this specific runner).
#
# Does NOT touch $DEPLOY_PATH or any production state: checks out a fresh,
# throwaway copy of pwa/ into the ephemeral GITHUB_WORKSPACE instead of
# reusing the persistent release tree. Delete this file before merging the
# Node-pin PR -- it exists only to produce a real result to link from that
# PR's description.

on:
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate setup-node on grid-svr
    runs-on: [self-hosted, grid-svr]

    steps:
      - name: Record global Node before
        run: |
          echo "global node (PATH before setup-node runs): $(command -v node)"
          echo "global node version: $(node --version)"

      - name: Set up Node (this job only)
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"

      - name: Confirm the pinned version wins on PATH, not the global install
        run: |
          set -euo pipefail
          echo "node resolves to: $(command -v node)"
          echo "node --version: $(node --version)"
          echo "npm --version: $(npm --version)"
          actual="$(node --version)"
          if [ "$actual" != "v22.23.2" ]; then
            echo "::error::expected v22.23.2 on PATH, got $actual"
            exit 1
          fi

      - name: Confirm the global install is untouched
        run: |
          set -euo pipefail
          global_version="$(/usr/local/bin/node --version 2>&1 || echo MISSING)"
          echo "grid-svr's own /usr/local/bin/node --version: $global_version"
          if [ "$global_version" != "v22.22.1" ]; then
            echo "::error::global Node changed (expected v22.22.1, got $global_version) -- this must never happen from this workflow"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          path: node-setup-validation-checkout

      - name: Real npm ci + build using the pinned Node, against a throwaway checkout
        working-directory: node-setup-validation-checkout/pwa
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Clean up the throwaway checkout
        if: always()
        run: rm -rf node-setup-validation-checkout
