# TEMPORARY BRANCH-ONLY REPLACEMENT. NEVER MERGE OR OPEN A PR.
# ENABLED REVIEW PROPOSAL. No publication or execution is authorized.
name: PR922 disposable contract DRAFT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract:
    if: ${{ true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PR922_APPROVED_COMMIT: ${{ github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate and tools without installation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$PR922_APPROVED_COMMIT"
          python3 -c 'import pr922_native_job_supervisor_v3 as v; v.verify_checkout()'
          python3 -c 'import platform,sys; assert sys.version_info[:2] == (3,12) and platform.machine() == "x86_64"; print(sys.version, platform.platform())'
          # Use the PG16 server suite rather than libpq-dev's potentially
          # different pg_config major. Fail closed if the image has drifted.
          PG_BIN="/usr/lib/postgresql/16/bin"
          for tool in initdb pg_ctl postgres psql; do test -x "$PG_BIN/$tool"; done
          PG_VERSION="$("$PG_BIN/postgres" --version)"
          case "$PG_VERSION" in 'postgres (PostgreSQL) 16.15'*) ;; *) exit 1 ;; esac
          echo "$PG_VERSION"
          echo "$PG_BIN" >> "$GITHUB_PATH"
      # Proposed network/package setup; execution needs separate admission.
      - name: Install two hash-pinned synthetic-test dependencies in job venv
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/grid922-venv"
          cat > "$RUNNER_TEMP/grid922-requirements.txt" <<'EOF'
          asyncpg==0.32.0 --hash=sha256:54851411bee2aa51a30d0911524201fbb05f82cc0f7c248b140203db637c723d
          loguru==0.7.3 --hash=sha256:31a33c10c8e1e10422bfd431aeb5d351c7cf7fa671e3c4df004162264b28220c
          EOF
          "$RUNNER_TEMP/grid922-venv/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/grid922-requirements.txt"
          "$RUNNER_TEMP/grid922-venv/bin/python" -m pip check
          "$RUNNER_TEMP/grid922-venv/bin/python" -c 'import asyncpg,loguru,events.bus; assert asyncpg.__version__ == "0.32.0" and loguru.__version__ == "0.7.3"'
          echo "$RUNNER_TEMP/grid922-venv/bin" >> "$GITHUB_PATH"
      - name: Admitted disposable native contract
        run: python3 -B pr922_native_job_supervisor_v3.py
