name: Quiver synthetic PostgreSQL qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quiver-synthetic-pg-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quiver-pg14:
    name: Quiver PG14 synthetic contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "15432"
      DB_NAME: qq_batch_test
      DB_USER: qq_ci_writer
      GRID_QQ_REQUIRE_PG: "1"
      GRID_JWT_SECRET: synthetic-ci-only
      TESTING: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record receiving checkout
        env:
          EXPECTED_CHECKOUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT"
          git show -s --format='checkout=%H tree=%T parents=%P'

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install existing project test dependencies
        timeout-minutes: 10
        run: python -m pip install -r requirements.txt

      - name: Generate ephemeral job-only database credentials
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          import re
          admin = secrets.token_hex(32)
          writer = secrets.token_hex(32)
          assert re.fullmatch(r'[0-9a-f]{64}', admin)
          assert re.fullmatch(r'[0-9a-f]{64}', writer)
          assert admin != writer
          # GitHub's interpreted masking protocol is the only credential output.
          # Flush both registrations before environment handoff/step headers.
          print(f'::add-mask::{admin}', flush=True)
          print(f'::add-mask::{writer}', flush=True)
          url = f'postgresql://qq_ci_writer:{writer}@127.0.0.1:15432/qq_batch_test'
          # Runner-owned environment handoff stays inside this disposable job.
          # No ordinary credential logging, argv values, or uploaded env file.
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              for key, value in {'POSTGRES_PASSWORD': admin, 'DB_PASSWORD': writer,
                                 'GRID_TEST_DB_URL': url, 'GRID_QQ_TEST_DB_URL': url}.items():
                  output.write(f'{key}={value}\n')
          PY

      # Hosted disposable VM only. Host networking makes the server-side address
      # genuinely127.0.0.1; Docker port publishing would expose a172.* server address
      # and fail the unchanged fixture. PG listens only on loopback port15432.
      - name: Start isolated synthetic PostgreSQL14
        timeout-minutes: 3
        run: |
          set -euo pipefail
          docker run --detach --name qq-synthetic-pg --network host \
            --label grid-purpose=quiver-synthetic-ci \
            -e POSTGRES_USER=qq_ci_admin \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_DB=postgres \
            postgres:14 -c listen_addresses=127.0.0.1 -c port=15432
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec qq-synthetic-pg pg_isready -h 127.0.0.1 -p 15432 -U qq_ci_admin -d postgres; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          python - <<'PY'
          import os
          import re
          import psycopg2
          from psycopg2 import sql
          admin, writer = os.environ['POSTGRES_PASSWORD'], os.environ['DB_PASSWORD']
          assert re.fullmatch(r'[0-9a-f]{64}', admin)
          assert re.fullmatch(r'[0-9a-f]{64}', writer)
          assert admin != writer
          connection = psycopg2.connect(host='127.0.0.1', port=15432, dbname='postgres',
                                        user='qq_ci_admin', password=admin, connect_timeout=5)
          try:
              connection.autocommit = True
              with connection.cursor() as cursor:
                  cursor.execute(sql.SQL("CREATE ROLE qq_ci_writer LOGIN PASSWORD {} NOSUPERUSER NOCREATEROLE NOCREATEDB NOREPLICATION").format(sql.Literal(writer)))
                  cursor.execute("CREATE DATABASE qq_batch_test OWNER qq_ci_writer")
                  cursor.execute("COMMENT ON DATABASE qq_batch_test IS 'grid-quiver-synthetic-ci-only'")
          finally:
              connection.close()
          PY
          docker inspect --format='image={{.Image}} network={{.HostConfig.NetworkMode}} purpose={{index .Config.Labels "grid-purpose"}}' qq-synthetic-pg

      - name: Verify synthetic identity before tests
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          import re
          password = os.environ['DB_PASSWORD']
          assert re.fullmatch(r'[0-9a-f]{64}', password)
          expected = f'postgresql://qq_ci_writer:{password}@127.0.0.1:15432/qq_batch_test'
          assert os.environ['GRID_TEST_DB_URL'] == expected
          assert os.environ['GRID_QQ_TEST_DB_URL'] == expected
          engine = create_engine(expected, connect_args={'connect_timeout': 5})
          try:
              with engine.connect() as conn:
                  identity = conn.execute(text("SELECT current_database(), current_user, host(inet_server_addr()), inet_server_port(), current_setting('server_version_num')::int, rolsuper, rolcreaterole, rolcreatedb, rolreplication FROM pg_roles WHERE rolname=current_user")).one()
                  assert tuple(identity[:4]) == ('qq_batch_test', 'qq_ci_writer', '127.0.0.1', 15432), identity
                  assert identity[4] // 10000 == 14, identity
                  assert tuple(identity[5:]) == (False, False, False, False), identity
                  marker = conn.execute(text("SELECT shobj_description(oid,'pg_database') FROM pg_database WHERE datname=current_database()")).scalar_one()
                  assert marker == 'grid-quiver-synthetic-ci-only', marker
                  print('Synthetic PG identity verified:', tuple(identity))
          finally:
              engine.dispose()
          PY

      - name: Run all six native Quiver modules serially
        timeout-minutes: 10
        run: |
          python -m pytest -q --tb=short --timeout=60 -n 0 --junitxml=qq-native-results.xml \
            tests/test_qq_short_transactions_pg.py \
            tests/test_qq_final_safety_pg.py \
            tests/test_qq_cleanup_safety_pg.py \
            tests/test_qq_publication_cleanup_pg.py \
            tests/test_qq_audit_context_pg.py \
            tests/test_qq_interruption_receipt_pg.py

      - name: Require native coverage and no skipped cases
        if: always()
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('qq-native-results.xml').getroot()
          cases = root.findall('.//testcase')
          expected = {'tests.test_qq_short_transactions_pg', 'tests.test_qq_final_safety_pg', 'tests.test_qq_cleanup_safety_pg', 'tests.test_qq_publication_cleanup_pg', 'tests.test_qq_audit_context_pg', 'tests.test_qq_interruption_receipt_pg'}
          observed = {case.attrib.get('classname') for case in cases}
          assert expected <= observed, (expected, observed)
          assert cases and not root.findall('.//skipped') and not root.findall('.//failure') and not root.findall('.//error')
          print('Native Quiver qualification: passed=', len(cases), 'modules=', sorted(observed), 'skipped=0')
          PY

      - name: Resolver native transaction and watermark contracts
        timeout-minutes: 4
        env:
          GRID_RESOLVER_REQUIRE_PG: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          unset PYTEST_ADDOPTS PYTEST_PLUGINS PYTHONPATH
          while IFS= read -r key; do unset "$key"; done < <(compgen -A variable PG || true)
          python - <<'PY'
          import platform
          import psycopg2
          from psycopg2.extensions import libpq_version
          import sqlalchemy
          print('resolver runtime: python=', platform.python_version(),
                'sqlalchemy=', sqlalchemy.__version__, 'psycopg2=', psycopg2.__version__,
                'libpq_compiled=', psycopg2.__libpq_version__, 'libpq_runtime=', libpq_version())
          PY
          docker inspect --format='resolver synthetic image={{.Image}}' qq-synthetic-pg
          timeout --signal=TERM --kill-after=10s 150s python -m pytest \
            tests/test_resolver_transaction_pg.py --noconftest -o addopts= \
            -p no:cacheprovider -p no:xdist --capture=tee-sys -q -rA \
            --junitxml=resolver-native-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('resolver-native-results.xml').getroot()
          cases = root.findall('.//testcase')
          if len(cases) != 35 or root.findall('.//skipped') or root.findall('.//failure') or root.findall('.//error'):
              raise SystemExit('resolver native qualification count or result mismatch')
          print('Resolver native qualification: passed=', len(cases), 'skipped=0')
          PY

      - name: Destroy synthetic database container and volume
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if docker container inspect qq-synthetic-pg >/dev/null 2>&1; then
            test "$(docker inspect --format='{{index .Config.Labels "grid-purpose"}}' qq-synthetic-pg)" = quiver-synthetic-ci
            timeout 30s docker rm --force --volumes qq-synthetic-pg
          fi
          test -z "$(docker ps -aq --filter name='^/qq-synthetic-pg$')"
