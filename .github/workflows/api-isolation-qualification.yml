name: API isolation synthetic qualification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: api-isolation-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-capsule:
    if: github.repository == '3pacs/GRID' && github.event.pull_request.number == 857 && github.event.pull_request.head.repo.full_name == '3pacs/GRID' && github.head_ref == 'codex/hermes-finra-v8-caller-composition-20261017'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.10', '3.11']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GRID_GIT_SINK_DISABLED: '1'
      GIT_SINK_PUSH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Create owned runtime scratch
        timeout-minutes: 1
        run: |
          python -B - <<'PY'
          import os,tempfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          assert root.is_absolute() and root.is_dir()
          owned=Path(tempfile.mkdtemp(prefix='grid-api-ci-owned-',dir=root))
          assert '\n' not in str(owned) and '\r' not in str(owned)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('API_ISOLATION_SCRATCH='+str(owned)+'\n')
          PY
      - name: Exact pure and injected capsule methods
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=10s 150s python -B .github/scripts/qualify_api_isolation.py --mode pure
      - name: Exact native synthetic capsule methods
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=10s 240s python -B .github/scripts/qualify_api_isolation.py --mode native
      - name: Remove only owned runtime scratch
        if: always()
        timeout-minutes: 1
        run: |
          python -B - <<'PY'
          import json,os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']).resolve()
          owned=Path(os.environ['API_ISOLATION_SCRATCH'])
          assert owned.is_absolute() and not owned.is_symlink()
          assert owned.parent.resolve()==root and owned.name.startswith('grid-api-ci-owned-')
          shutil.rmtree(owned)
          assert not owned.exists()
          Path('api-isolation-cleanup.json').write_text(json.dumps({'owned_scratch_removed':True})+'\n')
          PY
      - name: Require complete successful receipts
        if: always()
        timeout-minutes: 1
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('api-isolation-cleanup.json').read_text())['owned_scratch_removed']
          for mode,count in [('pure',89),('native',9)]:
              r=json.loads(Path('api-isolation-'+mode+'.json').read_text())
              assert r['qualified'] and r['cleanup'] and r['fixture_roots_removed']
              assert r['tests_run']==count and len(r['cases'])==count
              assert r['skipped']==r['errors']==r['failures']==r['own_children_alive']==0
          print('Exact capsule:89pure+9native,zero skips/errors/failures,owned cleanup confirmed')
          PY
      - name: Upload bounded qualification receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-isolation-${{ matrix.python }}-${{ github.run_id }}
          path: |
            api-isolation-pure.json
            api-isolation-native.json
            api-isolation-cleanup.json
          if-no-files-found: error
          retention-days: 7
