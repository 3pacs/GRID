name: Deploy to Grid Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test verification'
        required: false
        default: 'false'

env:
  DEPLOY_PATH: /data/grid_v4/grid_release

jobs:
  verify:
    name: Pre-deploy Verification
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: griddb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Run critical tests
        env:
          DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/test_api.py tests/test_pit.py -v --tb=short -x --timeout=30

  deploy:
    name: Deploy
    runs-on: [self-hosted, grid-svr]
    needs: [verify]
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')

    steps:
      - name: Deploy from clean release tree
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin && git reset --hard origin/main
          pip install -r requirements.txt
          cd pwa && npm ci && npm run build && cd ..
          python -m alembic upgrade head || echo "no migrations"
          sudo systemctl restart grid-api
          sleep 3 && curl -fsS http://localhost:8000/api/v1/system/health
          curl -fsS http://localhost:8000/openapi.json | grep -F '"/api/v1/intelligence/actor-network"'

      - name: Notify success
        if: success()
        run: echo "Deployment successful"

      - name: Notify failure
        if: failure()
        run: echo "Deployment FAILED - check server logs"