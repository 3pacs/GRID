name: Deploy to Grid Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test verification'
        required: false
        default: 'false'
      do_restart:
        description: 'Restart grid-api and grid-hermes after deploy'
        type: boolean
        required: false
        default: true
      activate_scheduler:
        description: 'One-time: also restart grid-scheduler onto the release path (interrupts its current pass -- see deploy.yml comments). Never implied by a routine push or by do_restart. Also requires acknowledge_scheduler_interruption=true.'
        type: boolean
        required: false
        default: false
      acknowledge_scheduler_interruption:
        description: 'Required to activate grid-scheduler: explicitly acknowledges the restart will interrupt whatever is currently running (a puller call in progress, or another scheduled job). There is no automated safe-to-restart check. Only consulted when activate_scheduler=true.'
        type: boolean
        required: false
        default: false
      activate_realtime:
        description: 'Restart grid-realtime onto the release path. Opt-in, NOT on the same gate as grid-api/grid-hermes/do_restart -- the candle merge across a restart has known, tested correctness gaps (see docs/TODO-REALTIME-CANDLE-CORRECTNESS.md). Also requires acknowledge_realtime_interruption=true.'
        type: boolean
        required: false
        default: false
      acknowledge_realtime_interruption:
        description: 'Required to activate grid-realtime: explicitly acknowledges that the candle bucket straddling this restart may end up with an incorrect close or under-reported volume/trade_count for the affected symbol(s) (see scripts/realtime_activation_gate.sh). Only consulted when activate_realtime=true.'
        type: boolean
        required: false
        default: false
      run_ticker_probe:
        description: 'Opt-in diagnostic only, separate from activation: after a successful scheduler restart, run one bounded, time-limited pull_ticker(^DJI) call to check the bounded query completes without a statement timeout. Only consulted when activate_scheduler=true. Its result is reported separately and never affects whether activation itself is considered successful.'
        type: boolean
        required: false
        default: false
      skip_migrations:
        description: 'Skip alembic upgrade head (explicit opt-out only; never silent)'
        type: boolean
        required: false
        default: false

env:
  DEPLOY_PATH: /data/grid_v4/grid_release

jobs:
  verify:
    name: Pre-deploy Verification
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Start Postgres (resilient pull)
        run: |
          set -euo pipefail
          # GitHub-hosted runners pull service-container images from Docker Hub
          # *before any step runs*, so a flaky pull (registry-1.docker.io:
          # "context deadline exceeded") fails the whole job with no retry path.
          # Start Postgres manually instead, retrying the pull with backoff.
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:15; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::docker pull postgres:15 failed after 5 attempts"
              exit 1
            fi
            backoff=$(( attempt * 5 ))
            echo "::warning::docker pull postgres:15 failed (attempt ${attempt}/5); retrying in ${backoff}s"
            sleep "${backoff}"
          done
          docker run -d --name grid-postgres \
            -e POSTGRES_USER=grid \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=griddb_test \
            -p 5432:5432 \
            postgres:15

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker exec grid-postgres pg_isready -U grid -d griddb_test >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready in time"
          docker logs grid-postgres || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Run critical tests
        env:
          DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          # config.py now rejects an empty DB_PASSWORD unconditionally (see
          # the 2026-09-13 incident) — must match the postgres container
          # password above so Settings() construction doesn't fail collection.
          DB_PASSWORD: testpass
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/test_api.py tests/test_pit.py -v --tb=short -x --timeout=30

  deploy:
    name: Deploy
    runs-on: [self-hosted, grid-svr]
    needs: [verify]
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')

    steps:
      - name: Build release tree
        env:
          SRC_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "before: $(git log --oneline -1)"
          # Fetch from GitHub itself with the job token, not from whatever `origin`
          # points at: the clone's origin went stale in 2026 and every deploy after
          # #364 reset to the same old commit while reporting success.
          git fetch "$SRC_URL" main
          git reset --hard FETCH_HEAD
          echo "after:  $(git log --oneline -1)"
          # A merge burst (several PRs landing within a minute) means an older run's
          # `main` fetch can already be a strict ancestor of a newer commit that merged
          # in the meantime — the release tree still contains the pushed commit, it's
          # just not HEAD anymore. Accept "pushed commit is an ancestor of HEAD" instead
          # of requiring exact equality, so only the newest run (which is what should
          # deploy anyway) needs to pass.
          git merge-base --is-ancestor "${{ github.sha }}" HEAD || { echo "::error::release tree is not at the pushed commit ${{ github.sha }}"; exit 1; }
          pip install -r requirements.txt
          # This step never pins a Node version -- it builds with whatever is
          # already on the runner's PATH (grid-svr's own global install, not
          # anything actions/setup-node manages). pwa/.npmrc sets
          # engine-strict=true, so `npm ci` itself now fails loudly on any
          # installed package's real `engines.node` range (vitest 5's
          # ^22.12.0 || ^24.0.0 || >=26.0.0 included) instead of the
          # non-fatal EBADENGINE warning npm prints by default -- no
          # hand-rolled version check to keep in sync here.
          cd pwa && npm ci && npm run build && cd ..
          if [ "${{ inputs.skip_migrations }}" = "true" ]; then
            echo "::warning::alembic upgrade head skipped via workflow_dispatch input skip_migrations=true"
          else
            # Source the same GRID .env candidates ops-exec.yml uses so alembic gets DB
            # credentials — the release tree carries no .env of its own, which is why
            # every deploy before this one failed on "no password supplied" (or, before
            # PR #443, on the divergent alembic heads) and had the failure swallowed by
            # `|| echo "no migrations"`. No migration has ever actually been applied by
            # a deploy; echo only which file was sourced, never its contents.
            for f in /data/grid_v4/grid_release/.env /home/grid/grid_v4/grid_repo/.env /home/grid/grid_v4/grid_repo/grid/.env; do
              if [ -f "$f" ]; then set -a; . "$f"; set +a; echo "(env sourced from $f)"; break; fi
            done
            {
              echo "## Alembic"
              echo '### current (before upgrade)'
              echo '```'
              python3 -m alembic current
              echo '```'
              echo '### heads'
              echo '```'
              python3 -m alembic heads
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            python3 -m alembic upgrade head
            # ...and again afterwards. Without this the summary records only
            # where the database *was*: `alembic current` before the upgrade,
            # and then silence. Run 641 is the case -- the upgrade ran, a
            # revision took its deferral branch, and the log showed neither
            # which revisions were applied nor where head ended up. A deploy
            # that migrates the production database should say so in its own
            # record.
            {
              echo '### current (after upgrade)'
              echo '```'
              python3 -m alembic current
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restart grid-api
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/systemd/system/grid-api.service.d
          printf '%s\n' '[Service]' "WorkingDirectory=$DEPLOY_PATH" | sudo tee /etc/systemd/system/grid-api.service.d/zz-release-worktree.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart grid-api

      - name: Verify running API (health + OpenAPI)
        run: |
          set -euo pipefail
          # grid-api imports the whole intelligence tree at startup; on
          # 2026-09-10 it took 96 s to start listening and the 90 s window
          # failed a deploy that had actually landed. Allow four minutes.
          for attempt in {1..120}; do
            if curl -fsS http://localhost:8000/api/v1/system/health; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "grid-api did not pass health check after restart"
              sudo systemctl status grid-api --no-pager -l || true
              journalctl -u grid-api -n 120 --no-pager || true
              exit 1
            fi
            sleep 2
          done
          echo
          fail() { echo "::error::verify failed: $*"; exit 1; }
          api_pid="$(systemctl show -p MainPID --value grid-api)"
          cwd="$(sudo -n readlink "/proc/${api_pid}/cwd" 2>/dev/null || readlink "/proc/${api_pid}/cwd" 2>/dev/null || true)"
          echo "grid-api pid=$api_pid cwd=$cwd"
          [ "$cwd" = "$DEPLOY_PATH" ] || fail "grid-api cwd '$cwd' != $DEPLOY_PATH"
          curl -fsS http://localhost:8000/ > /tmp/grid-index.html || fail "GET / failed"
          index_js="$(grep -o '/assets/index-[^"]*\.js' /tmp/grid-index.html | head -1 || true)"
          echo "index asset: ${index_js:-<none>}"
          [ -n "$index_js" ] || fail "no /assets/index-*.js in index.html (PWA build missing?)"
          curl -fsS "http://localhost:8000${index_js}" > /tmp/grid-index.js || fail "GET $index_js failed"
          # The gold stream client may live in a lazily loaded chunk after code-splitting; check all served chunks.
          if ! grep -qF '/gold/stream' /tmp/grid-index.js; then
            found=0
            for chunk in $(grep -o '/assets/[^"]*\.js' /tmp/grid-index.html | sort -u); do
              curl -fsS "http://localhost:8000${chunk}" 2>/dev/null | grep -qF '/gold/stream' && { found=1; echo "gold stream client found in $chunk"; break; }
            done
            [ "$found" = 1 ] || grep -rqF '/gold/stream' "$DEPLOY_PATH/pwa_dist/assets" || fail "'/gold/stream' not in any built PWA chunk"
          fi
          curl -fsS http://localhost:8000/openapi.json > /tmp/grid-openapi.json || fail "GET /openapi.json failed"
          grep -qF '"/api/v1/intelligence/actor-network"' /tmp/grid-openapi.json || fail "actor-network route missing from OpenAPI"
          grep -qF '"/api/v1/dad/ticker/{ticker}/gold/stream"' /tmp/grid-openapi.json || fail "gold/stream route missing from OpenAPI"
          grep -qF '"/api/v1/conviction/sweeps/latest"' /tmp/grid-openapi.json || fail "sweeps/latest route missing from OpenAPI (Sprint 3 not live)"
          echo "verify: all assertions passed"

      # grid-hermes runs `ExecStart=/usr/bin/python3 scripts/hermes_operator.py`
      # with a RELATIVE path, resolved against WorkingDirectory. Its unit pins
      # that to the Hermes tree, which no deploy writes to -- so every
      # Hermes-side change has shipped to grid_release and then not run. #487
      # (2026-09-13) and #490 (2026-09-14) both sat deployed-but-inert for
      # exactly that reason: on 2026-09-14 the live process was still on
      # 5facbdf0, started 2026-09-11, with zero occurrences of
      # DISTINCT_SCAN_SLICE_HOURS or RESOLUTION_SCAN_BUDGET_SECONDS.
      #
      # This is the same drop-in grid-api already gets, so both services run the
      # tree this workflow actually deployed. Placed after the API verify: if the
      # API did not come back healthy, stop before bouncing a second service.
      - name: Restart grid-hermes
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/systemd/system/grid-hermes.service.d
          printf '%s\n' '[Service]' "WorkingDirectory=$DEPLOY_PATH" | sudo tee /etc/systemd/system/grid-hermes.service.d/zz-release-worktree.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart grid-hermes

      # Prove it is running the DEPLOYED tree, not merely that it is alive. A
      # bare `is-active` would have reported green through the whole period the
      # daemon ran three-day-old code, which is the failure this exists to make
      # impossible.
      - name: Verify grid-hermes runs the deployed tree
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            state="$(systemctl is-active grid-hermes || true)"
            [ "$state" = "active" ] && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::grid-hermes not active after restart (state=$state)"
              sudo systemctl status grid-hermes --no-pager -l || true
              journalctl -u grid-hermes -n 60 --no-pager || true
              exit 1
            fi
            sleep 2
          done
          pid="$(systemctl show -p MainPID --value grid-hermes)"
          cwd="$(sudo -n readlink "/proc/${pid}/cwd" 2>/dev/null || readlink "/proc/${pid}/cwd" 2>/dev/null || true)"
          echo "grid-hermes pid=$pid cwd=$cwd"
          # DEPLOY_PATH is reached through a symlink on this host, so compare
          # resolved paths rather than the literal strings.
          want="$(readlink -f "$DEPLOY_PATH")"
          [ -n "$cwd" ] && [ "$(readlink -f "$cwd")" = "$want" ] || {
            echo "::error::grid-hermes cwd '$cwd' does not resolve to $want -- it is running a different tree"
            exit 1
          }
          echo "verify: grid-hermes is running the deployed tree"

      # grid-realtime has the exact same class of bug already fixed for
      # grid-hermes (#487/#490): its unit runs `ExecStart=/usr/bin/python3 -m
      # ingestion.realtime.ws_listener`, and `-m` resolves that module against
      # sys.path with the process's cwd prepended -- which systemd sets from
      # WorkingDirectory. That unit pins WorkingDirectory to
      # /home/grid/grid_v4/grid_repo, a checkout this workflow never writes
      # to, so every realtime-side change has shipped to grid_release and
      # never run for this process. There is no restart step for it at all in
      # this workflow prior to this change (grep confirms zero references to
      # "grid-realtime" here before this diff).
      #
      # Confirmed live 2026-09-16: grid-realtime's process (PID 16196) has
      # been running since 2026-07-29 with zero restarts since, and its
      # checkout at /home/grid/grid_v4/grid_repo was last fast-forwarded
      # around 2026-09-11 (5facbdf0) -- both predate every dependency/bug-fix
      # PR merged around 2026-09-15/16 (#366, #367, #371, #374, #503).
      #
      # UNLIKE grid-api/grid-hermes, grid-realtime is gated the SAME WAY as
      # grid-scheduler below: behind an explicit `activate_realtime` input
      # plus `acknowledge_realtime_interruption`, never on a routine push or
      # on `do_restart` (which only covers api/hermes). An earlier version
      # of this fix put grid-realtime on the unconditional gate, reasoning
      # that "Restart=always already makes unplanned restarts normal" was
      # sufficient justification on its own. Closer review found a real,
      # pre-existing (not introduced by this PR) risk that reasoning
      # glossed over: every candle write is `INSERT ... ON CONFLICT
      # (symbol, interval, ts) DO NOTHING` (flusher.py) -- unchanged by this
      # PR -- which is idempotent (no duplicate/corrupt row) but does NOT
      # mean the most complete candle wins. A truncated shutdown-flush
      # candle and a later, complete candle for the same bucket share the
      # identical primary key, and whichever lands first (always the
      # truncated one, since the old process's flush provably completes
      # before the new process's write is even possible) permanently blocks
      # the other -- proven against real Postgres, not asserted, in
      # tests/test_realtime_shutdown_semantics.py::
      # test_truncated_candle_blocks_a_later_complete_candle_for_the_same_bucket.
      # A source-aware merge (DO UPDATE instead of DO NOTHING) was explored
      # in an earlier round of this same PR and then reverted after review
      # found real, unresolved correctness gaps in it -- see
      # docs/TODO-REALTIME-CANDLE-CORRECTNESS.md for that history and what
      # an actual fix requires (a schema-level change: trade-level
      # identity/order for Binance, per-minute tracking for Yahoo), and
      # docs/realtime_candle_merge_proposal_tests.py for the reverted draft,
      # kept as a starting point for that follow-up. This PR does not
      # change candle persistence semantics at all -- it carries the same
      # truncation risk any unplanned crash-and-restart already carries
      # today, one bucket per symbol per restart, bounded but real, so
      # -- combined with this being the first-ever automated restart of a
      # daemon that has otherwise run untouched for months -- it goes
      # through the same explicit-acknowledgment gate as grid-scheduler
      # (scripts/realtime_activation_gate.sh) rather than being treated as
      # already safe. This still rests on real, verified fixes from this
      # PR that ARE unconditionally true regardless of the above:
      #   - SIGTERM triggers a graceful shutdown (ws_listener.py::main) that
      #     cancels the feed tasks and flushes whatever candle is in progress
      #     before exiting.
      #   - Traced empirically (see this PR's description) that final
      #     flushing is NOT at risk from a slow, unwrapped `run_in_executor`
      #     call (e.g. Yahoo's synchronous `yf.download()`) -- cancellation
      #     delivery doesn't wait on an orphaned executor thread. The REAL
      #     risk found was different: flusher.py's and dex_scanner.py's
      #     periodic/spike DB writes were DIRECT, unwrapped synchronous calls
      #     on the event loop -- a slow one could block the loop itself,
      #     including the SIGTERM handler, delaying the whole shutdown
      #     sequence past systemd's TimeoutStopUSec (90s default, unset in
      #     this unit) and risking a SIGKILL that skips the final flush
      #     entirely. Fixed: every DB write in ingestion/realtime/ now runs
      #     through db_writer.bounded_write(), off the event loop and capped
      #     at 2 concurrent (see that module's docstring), and the final
      #     flush itself is wrapped in a 30s asyncio.wait_for so a stalled
      #     write can't hang shutdown indefinitely either.
      #   - The Binance feed (feeds/binance.py) already reconnects with
      #     exponential backoff on any disconnect -- a restart looks like just
      #     another disconnect from Binance's side. It never opens a DB
      #     connection directly (only flusher.py does, on its behalf), so
      #     reconnect storms don't compound DB connection pressure.
      #   - The Yahoo feed (feeds/yahoo.py) is a stateless 60s HTTP poll with
      #     no persistent connection and nothing to lose across a restart.
      - name: Report grid-realtime activation status
        if: ${{ inputs.activate_realtime != true }}
        run: |
          {
            echo "grid-realtime was NOT restarted this run (activate_realtime was not set)."
            echo "It continues running its existing checkout, independent of the release tree this run deployed."
            echo "**Realtime activation remains pending.** To activate: run this workflow via workflow_dispatch with activate_realtime=true and acknowledge_realtime_interruption=true."
            echo "See docs/TODO-REALTIME-CANDLE-CORRECTNESS.md for why activation is gated: candle-merge correctness gaps across a restart, tested but not yet fixed."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require explicit interruption acknowledgment (grid-realtime)
        if: ${{ inputs.activate_realtime == true }}
        # This job never runs actions/checkout -- it gets code onto the box
        # entirely via "Build release tree" above -- so the gate script is
        # read from $DEPLOY_PATH (the tree that step just fetched), not a
        # workspace-relative path that wouldn't resolve here.
        run: bash "$DEPLOY_PATH/scripts/realtime_activation_gate.sh" "${{ inputs.acknowledge_realtime_interruption }}"

      - name: Restart grid-realtime (activate_realtime only)
        if: ${{ inputs.activate_realtime == true }}
        run: |
          set -euo pipefail
          sudo bash "$DEPLOY_PATH/scripts/realtime_dropin_backup.sh" \
            /etc/systemd/system/grid-realtime.service.d \
            /etc/systemd/system/grid-realtime.service.d/zz-release-worktree.conf \
            "$DEPLOY_PATH" \
            grid-realtime | tee -a "$GITHUB_STEP_SUMMARY"
          sudo systemctl daemon-reload
          sudo systemctl restart grid-realtime

      # Proves the NEW process actually booted from the release path --
      # not that grid-realtime is merely alive (a bare is-active would stay
      # green through the entire period it ran stale code, exactly like the
      # grid-hermes incident this mirrors), and not that it is delivering
      # fresh data (that's the separate "Verify grid-realtime is delivering
      # fresh data" step below -- a process that started cleanly can still
      # be stuck on a broken feed).
      - name: Verify grid-realtime runs the deployed tree
        if: ${{ inputs.activate_realtime == true }}
        run: |
          set -euo pipefail
          date -u +%s > "$RUNNER_TEMP/grid-realtime-restart-ts"
          for attempt in {1..30}; do
            state="$(systemctl is-active grid-realtime || true)"
            [ "$state" = "active" ] && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::grid-realtime not active after restart (state=$state)"
              sudo systemctl status grid-realtime --no-pager -l || true
              journalctl -u grid-realtime -n 60 --no-pager || true
              exit 1
            fi
            sleep 2
          done
          pid="$(systemctl show -p MainPID --value grid-realtime)"
          cwd="$(sudo -n readlink "/proc/${pid}/cwd" 2>/dev/null || readlink "/proc/${pid}/cwd" 2>/dev/null || true)"
          echo "grid-realtime pid=$pid cwd=$cwd"
          want="$(readlink -f "$DEPLOY_PATH")"
          [ -n "$cwd" ] && [ "$(readlink -f "$cwd")" = "$want" ] || {
            echo "::error::grid-realtime cwd '$cwd' does not resolve to $want -- it is running a different tree"
            exit 1
          }
          restart_ts="$(cat "$RUNNER_TEMP/grid-realtime-restart-ts")"
          for attempt in {1..30}; do
            if journalctl -u grid-realtime --since "@${restart_ts}" --no-pager -q 2>/dev/null \
                 | grep -qF '4 async tasks'; then
              echo "found the startup log line confirming a clean boot"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::did not see the startup log line within 2.5 minutes of restart"
              journalctl -u grid-realtime -n 80 --no-pager || true
              exit 1
            fi
            sleep 5
          done
          echo "verify: grid-realtime booted the deployed tree (process/cwd/startup-log only -- see the next step for data freshness)"

      # Deliberately separate from the step above: booting cleanly from the
      # right directory says nothing about whether Yahoo or Binance are
      # actually delivering data post-restart (a broken API key, a changed
      # Yahoo response shape, a Binance endpoint change -- any of these would
      # leave the process "running the deployed tree" and completely silent
      # at the same time). Bounded to ~4 minutes: Yahoo polls every 60s,
      # Binance ticks are near-continuous when markets are open, so a fresh
      # row from EITHER source is expected well inside that window whenever
      # markets are open.
      #
      # Reported PER SOURCE, deliberately not folded into one pass/fail,
      # because they have different excuses for silence: Yahoo covers
      # equities/futures/forex, closed outside market hours, so Yahoo being
      # quiet is often just "no market open right now" -- but Binance is
      # crypto, trades 24/7, and has no such excuse. Binance silence is
      # flagged with a stronger warning than Yahoo silence for that reason.
      # This step still never fails the deploy either way: it cannot
      # distinguish "quiet market" from "broken feed" for Yahoo, and even
      # for Binance a transient issue shouldn't block a deploy that already
      # passed process-start verification -- so every outcome below is
      # recorded, not gated on.
      - name: Verify grid-realtime is delivering fresh data
        if: ${{ inputs.activate_realtime == true }}
        run: |
          set -euo pipefail
          for f in /data/grid_v4/grid_release/.env /home/grid/grid_v4/grid_repo/.env; do
            if [ -f "$f" ]; then set -a; . "$f"; set +a; break; fi
          done
          cd "$DEPLOY_PATH"
          # restart_ts is captured by the PREVIOUS step ("Verify grid-realtime
          # runs the deployed tree") as its very first action -- which only
          # starts running after THIS step's own "Restart grid-realtime"
          # (systemctl restart, a blocking call covering both the stop-with-
          # shutdown-flush and the start) has already returned. So restart_ts
          # unambiguously post-dates the old process's entire shutdown
          # sequence, including its own final candle flush -- a row whose
          # created_at is after restart_ts could not have been written by the
          # dying old process, only by the new one.
          #
          # Deliberately NOT also matching on a ts time-window (an earlier
          # version of this check did -- but ts >= some-window is a
          # timestamp-window match, not proof of new ingestion: it can
          # equally match a row the OLD process's shutdown flush wrote for
          # that same bucket, which is exactly the ambiguity this check
          # exists to resolve, not reproduce). created_at is set only by an
          # actual INSERT (see INSERT_SQL in flusher.py -- `ON CONFLICT DO
          # NOTHING` means a colliding write either lands as a fresh INSERT
          # for a new bucket, or is entirely discarded for a colliding one;
          # there is no UPDATE path that could touch an existing row's
          # created_at). So this check proves fresh INSERTs specifically,
          # and will not see the ONE bucket per symbol whose complete
          # candle got silently discarded by DO NOTHING at the restart
          # boundary (see docs/TODO-REALTIME-CANDLE-CORRECTNESS.md) -- but
          # the periodic flusher runs across many OTHER buckets too, and a
          # genuinely working feed will produce at least one fresh INSERT
          # (a new bucket rolling over) well within the 4-minute window
          # below regardless of that one discarded bucket -- so this check
          # still reliably detects overall feed liveness; it's a
          # false-negative risk only for that single colliding bucket
          # specifically, never a false-positive one (it can't claim
          # freshness that didn't happen, since created_at is only ever set
          # by a real INSERT).
          restart_ts="$(cat "$RUNNER_TEMP/grid-realtime-restart-ts")"
          restart_iso="$(date -u -d "@${restart_ts}" +%Y-%m-%dT%H:%M:%SZ)"
          probe_out="$RUNNER_TEMP/grid-realtime-freshness-probe.txt"
          set +e
          timeout 240 python3 - "$restart_iso" > "$probe_out" <<'PYEOF'
          import sys
          from db import get_engine
          from sqlalchemy import text

          restart_iso = sys.argv[1]
          engine = get_engine()
          with engine.connect() as conn:
              rows = conn.execute(text("""
                  SELECT source, count(*), max(ts), max(created_at)
                  FROM realtime_candles
                  WHERE created_at > :restart_ts
                  GROUP BY source
              """), {"restart_ts": restart_iso}).fetchall()
          sources = {r[0]: (r[1], r[2], r[3]) for r in rows}

          # SEEN/UNVERIFIED per source, printed as parseable lines -- bash
          # below reports each source's own severity rather than collapsing
          # to one pass/fail, since Yahoo and Binance have different excuses
          # for silence (see this step's comment).
          for src in ("yahoo", "binance"):
              if src in sources:
                  n, latest_ts, latest_created = sources[src]
                  print(f"SEEN {src} count={n} latest_candle_ts={latest_ts} latest_row_created_at={latest_created}")
              else:
                  print(f"UNVERIFIED {src} -- no row with created_at strictly after restart_ts ({restart_iso})")
          PYEOF
          probe_rc=$?
          set -e
          cat "$probe_out"

          if [ "$probe_rc" -eq 124 ]; then
            echo "::warning::data-freshness check timed out after 4 minutes -- no result for either source"
            echo "grid-realtime data freshness: UNVERIFIED (yahoo) -- check timed out, not a feed-silence finding" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "grid-realtime data freshness: UNVERIFIED (binance) -- check timed out, not a feed-silence finding" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$probe_rc" -ne 0 ]; then
            echo "::warning::data-freshness check itself failed (probe_rc=$probe_rc) -- see the log above for the traceback"
            echo "grid-realtime data freshness: UNVERIFIED (yahoo) -- freshness check errored, not a feed-silence finding" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "grid-realtime data freshness: UNVERIFIED (binance) -- freshness check errored, not a feed-silence finding" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if grep -q "^SEEN yahoo" "$probe_out"; then
              echo "grid-realtime data freshness: yahoo CONFIRMED new insert since restart -- $(grep '^SEEN yahoo' "$probe_out")" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "grid-realtime data freshness: yahoo UNVERIFIED -- no fresh row seen. Not necessarily a problem: Yahoo covers equities/futures/forex, closed outside market hours -- this cannot distinguish a quiet market from a broken feed." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            if grep -q "^SEEN binance" "$probe_out"; then
              echo "grid-realtime data freshness: binance CONFIRMED new insert since restart -- $(grep '^SEEN binance' "$probe_out")" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::grid-realtime: no fresh binance candle seen since restart -- crypto trades 24/7, so unlike yahoo this is NOT explained by closed markets and deserves a closer look"
              echo "grid-realtime data freshness: binance UNVERIFIED -- no fresh row seen, and crypto trading 24/7 means a closed-market explanation does NOT apply here. Worth investigating if this persists." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # grid-scheduler has the exact same class of bug the grid-hermes fix
      # above addressed for #487/#490: its unit pins WorkingDirectory to
      # /home/grid/grid_v4/grid_repo, a separate checkout this workflow never
      # writes to. Confirmed 2026-09-15: grid_repo's HEAD (5facbdf0, dated
      # 2026-09-11) predates every PR merged today (#368/#370/#382/#383/#489/
      # #495/#498) and isn't even reachable on GitHub (a local-only merge
      # commit) -- its own `origin` remote can't authenticate (SSH key
      # rejected) either, so it can't self-heal. Confirmed live: the running
      # scheduler was still hitting the exact unbounded-query timeout #498
      # fixes, on ^DJI/^VIX6M/HG=F/GC=F, hours after grid-api/grid-hermes had
      # already redeployed successfully.
      #
      # Fix is the same release-path drop-in pattern as grid-api/grid-hermes
      # above -- only WorkingDirectory moves to $DEPLOY_PATH. EnvironmentFile
      # deliberately stays on grid_repo/.env, same reason grid-api/grid-hermes
      # keep it there too: grid_release carries no .env of its own. Confirmed
      # grid-scheduler shares the same interpreter and dependencies as
      # grid-api/grid-hermes (bare /usr/bin/python3.10, no venv, one shared
      # system site-packages -- e.g. tqdm is already 4.70.1 system-wide) so
      # this is purely a working-directory fix, not an environment migration.
      # The scheduler's own connection-pool override
      # (grid-scheduler.service.d/pool-budget.conf, EnvironmentFile= only) is
      # untouched by this -- different directive key, no collision.
      #
      # UNLIKE grid-api/grid-hermes, everything below is gated on the explicit
      # `activate_scheduler` input alone -- never on a routine push, and never
      # on `do_restart` (which still only covers api/hermes). grid-scheduler
      # is a long-running, sequential ingestion loop (ingestion/scheduler.py),
      # not a stateless request server.
      #
      # Safety is narrower than it might look, and is stated precisely rather
      # than as a blanket guarantee: each puller call is independently
      # transaction-scoped, so killing the process mid-flight can't leave a
      # torn write from THAT call. But whether the next scheduled pass is
      # duplicate-free on a re-run depends on each puller's own dedup logic --
      # confirmed for the yfinance path (_get_existing_dates, #498), NOT
      # audited across the ~100 other registered pullers in
      # ingestion/scheduler.py, some of which may not check-before-insert the
      # same way.
      #
      # There is no automated "safe to restart" check: a log tail can only
      # show what has already happened, and a historical completion marker
      # does not prove nothing has started since (an earlier version of this
      # workflow made exactly that mistake, comparing mismatched journalctl
      # output formats besides). So activation always requires an explicit
      # `acknowledge_scheduler_interruption=true` -- a human decision, informed
      # by whatever they check themselves (journalctl -u grid-scheduler, the
      # log tail this workflow also prints below, or otherwise), never an
      # automatic pass. See scripts/scheduler_activation_gate.sh (tested in
      # tests/test_scheduler_activation_gate.py) for the actual decision.
      - name: Report grid-scheduler activation status
        if: ${{ inputs.activate_scheduler != true }}
        run: |
          {
            echo "grid-scheduler was NOT restarted this run (activate_scheduler was not set)."
            echo "It continues running its existing checkout, independent of the release tree this run deployed."
            echo "**Scheduler activation remains pending.** To activate: run this workflow via workflow_dispatch with activate_scheduler=true and acknowledge_scheduler_interruption=true."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Purely informational -- makes no claim about current idleness. Shown
      # only so a human deciding on acknowledge_scheduler_interruption has
      # the same context this workflow does; it does not gate anything.
      - name: Show recent grid-scheduler activity (for your own judgment)
        if: ${{ inputs.activate_scheduler == true }}
        run: journalctl -u grid-scheduler -n 20 --no-pager -q || true

      - name: Require explicit interruption acknowledgment
        if: ${{ inputs.activate_scheduler == true }}
        # This job never runs actions/checkout -- it gets code onto the box
        # entirely via "Build release tree" above -- so the gate script is
        # read from $DEPLOY_PATH (the tree that step just fetched), not a
        # workspace-relative path that wouldn't resolve here.
        run: bash "$DEPLOY_PATH/scripts/scheduler_activation_gate.sh" "${{ inputs.acknowledge_scheduler_interruption }}"

      - name: Restart grid-scheduler (activate_scheduler only)
        if: ${{ inputs.activate_scheduler == true }}
        run: |
          set -euo pipefail
          # Recorded so the later verify step can search only logs from this
          # restart onward -- the pre-restart process already had the same
          # pool override (pool-budget.conf is untouched by this PR), so a
          # relative "last N minutes" search could match its old log line
          # and falsely confirm the NEW process initialized when it hadn't.
          date -u +%s > "$RUNNER_TEMP/grid-scheduler-restart-ts"
          sudo mkdir -p /etc/systemd/system/grid-scheduler.service.d
          # Preserve whatever is already there (if anything) so rollback can
          # restore the exact prior state rather than assuming "delete" is
          # correct -- true only if this is genuinely the first activation.
          DROPIN=/etc/systemd/system/grid-scheduler.service.d/zz-release-worktree.conf
          if [ -f "$DROPIN" ]; then
            BACKUP="${DROPIN}.bak-$(date -u +%Y%m%dT%H%M%SZ)"
            sudo cp -a "$DROPIN" "$BACKUP"
            echo "Existing drop-in backed up to $BACKUP"
            echo "Exact rollback: sudo cp -a $BACKUP $DROPIN && sudo systemctl daemon-reload && sudo systemctl restart grid-scheduler" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No pre-existing drop-in at $DROPIN (first activation)."
            echo "Exact rollback: sudo rm $DROPIN && sudo systemctl daemon-reload && sudo systemctl restart grid-scheduler" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' '[Service]' "WorkingDirectory=$DEPLOY_PATH" | sudo tee "$DROPIN" >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart grid-scheduler

      # Same proof-of-tree pattern as the grid-hermes verify above -- a bare
      # is-active would stay green through the whole time the scheduler ran
      # stale code, which is exactly the failure this exists to catch.
      - name: Verify grid-scheduler runs the deployed tree
        if: ${{ inputs.activate_scheduler == true }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            state="$(systemctl is-active grid-scheduler || true)"
            [ "$state" = "active" ] && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::grid-scheduler not active after restart (state=$state)"
              sudo systemctl status grid-scheduler --no-pager -l || true
              journalctl -u grid-scheduler -n 60 --no-pager || true
              exit 1
            fi
            sleep 2
          done
          pid="$(systemctl show -p MainPID --value grid-scheduler)"
          cwd="$(sudo -n readlink "/proc/${pid}/cwd" 2>/dev/null || readlink "/proc/${pid}/cwd" 2>/dev/null || true)"
          echo "grid-scheduler pid=$pid cwd=$cwd"
          want="$(readlink -f "$DEPLOY_PATH")"
          [ -n "$cwd" ] && [ "$(readlink -f "$cwd")" = "$want" ] || {
            echo "::error::grid-scheduler cwd '$cwd' does not resolve to $want -- it is running a different tree"
            exit 1
          }
          echo "verify: grid-scheduler is running the deployed tree"

      # Beyond PID/cwd: prove the pool override actually reached the new
      # process and that it initialized cleanly under that config (not just
      # is-active -- a crash-loop still reports active between crashes).
      # This step alone is what "activation succeeded" means; the ticker
      # probe below is a separate, optional diagnostic and does not
      # contribute to this result either way.
      - name: Verify effective pool config and clean initialization
        if: ${{ inputs.activate_scheduler == true }}
        run: |
          set -euo pipefail
          pid="$(systemctl show -p MainPID --value grid-scheduler)"

          echo "--- effective pool settings (from the running process's own environment) ---"
          env_pool="$( { sudo -n tr '\0' '\n' < "/proc/${pid}/environ" 2>/dev/null || tr '\0' '\n' < "/proc/${pid}/environ" 2>/dev/null; } | grep -E '^GRID_DB_(POOL_SIZE|MAX_OVERFLOW)=' | sort)"
          echo "$env_pool"
          echo "$env_pool" | grep -qx 'GRID_DB_POOL_SIZE=3' || { echo "::error::GRID_DB_POOL_SIZE is not 3 in the restarted process"; exit 1; }
          echo "$env_pool" | grep -qx 'GRID_DB_MAX_OVERFLOW=7' || { echo "::error::GRID_DB_MAX_OVERFLOW is not 7 in the restarted process"; exit 1; }

          echo "--- successful initialization under that same effective config ---"
          restart_ts="$(cat "$RUNNER_TEMP/grid-scheduler-restart-ts")"
          for attempt in {1..30}; do
            if journalctl -u grid-scheduler --since "@${restart_ts}" --no-pager -q 2>/dev/null | grep -qF 'pool_size=3, max_overflow=7'; then
              echo "found the engine-creation log line confirming effective config"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::did not see the pool_size=3, max_overflow=7 engine-creation log line within 2.5 minutes of restart"
              journalctl -u grid-scheduler -n 80 --no-pager || true
              exit 1
            fi
            sleep 5
          done
          echo "**grid-scheduler activated successfully** (effective pool config and clean initialization verified)." | tee -a "$GITHUB_STEP_SUMMARY"

      # Opt-in diagnostic ONLY -- gated separately from activation itself and
      # reported separately (see the summary lines below). A FAIL or TIMEOUT
      # here does not mean grid-scheduler failed to activate (that was
      # already determined by the mandatory step above), and this step never
      # fails the job -- it only records what it found. Uses a bounded
      # current-date window (last 7 days through tomorrow, computed at run
      # time -- not a hardcoded date that would go stale) and the scheduler's
      # own 3/7 pool budget rather than db.py's larger default, so this
      # one-off check stays inside the same connection budget the scheduler
      # itself is constrained to. Wrapped in a hard 90s timeout so a stuck
      # network call can't hang the job.
      - name: Ticker probe (opt-in diagnostic, separate from activation)
        if: ${{ inputs.activate_scheduler == true && inputs.run_ticker_probe == true }}
        run: |
          set -euo pipefail
          for f in /data/grid_v4/grid_release/.env /home/grid/grid_v4/grid_repo/.env /home/grid/grid_v4/grid_repo/grid/.env; do
            if [ -f "$f" ]; then set -a; . "$f"; set +a; echo "(env sourced from $f)"; break; fi
          done
          export GRID_DB_POOL_SIZE=3
          export GRID_DB_MAX_OVERFLOW=7
          cd "$DEPLOY_PATH"
          probe_from="$(date -u -d '-7 days' +%Y-%m-%d)"
          probe_end="$(date -u -d '+1 day' +%Y-%m-%d)"
          echo "probing ^DJI over a bounded current window: ${probe_from} .. ${probe_end} (exclusive end)"
          set +e
          timeout 90 python3 - "$probe_from" "$probe_end" <<'PYEOF'
          import sys
          import time
          from db import get_engine
          from ingestion.yfinance_pull import YFinancePuller

          start_date, end_date = sys.argv[1], sys.argv[2]
          t0 = time.time()
          result = YFinancePuller(get_engine()).pull_ticker(
              "^DJI", start_date=start_date, end_date=end_date
          )
          elapsed = time.time() - t0
          print(f"^DJI probe: status={result['status']} rows_inserted={result['rows_inserted']} "
                f"elapsed={elapsed:.1f}s errors={result['errors']}")
          ok = result["status"] in ("SUCCESS", "PARTIAL") and not any(
              "statement timeout" in str(e).lower() for e in result["errors"]
          )
          sys.exit(0 if ok else 1)
          PYEOF
          probe_rc=$?
          set -e
          if [ "$probe_rc" -eq 124 ]; then
            echo "::warning::ticker probe (diagnostic only) timed out after 90s -- does not affect the activation result above"
            echo "Ticker probe (diagnostic, separate from activation): TIMED OUT" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$probe_rc" -ne 0 ]; then
            echo "::warning::ticker probe (diagnostic only) did not pass -- does not affect the activation result above"
            echo "Ticker probe (diagnostic, separate from activation): FAILED" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Ticker probe (diagnostic, separate from activation): PASSED -- ^DJI completed over ${probe_from}..${probe_end} without a statement timeout" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify success
        if: success()
        run: echo "Deployment successful"

      - name: Notify failure
        if: failure()
        run: echo "Deployment FAILED - check server logs"

  dad-smoke:
    name: Dad Path Smoke (post-deploy, report-only)
    needs: [deploy]
    # Report-only (strict: false) until the dad-path smoke test has a track record on
    # real deploys — a failure here does not fail this workflow. Same gating as the
    # restart step: only meaningful right after a deploy that actually restarted
    # grid-api, and only if that deploy succeeded.
    if: needs.deploy.result == 'success' && (github.event_name == 'push' || inputs.do_restart == true)
    uses: ./.github/workflows/dad-smoke.yml
    with:
      base_url: http://127.0.0.1:8000
      strict: false
