name: Deploy to Grid Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test verification'
        required: false
        default: 'false'

env:
  SERVER_HOST: grid-svr
  SERVER_USER: grid
  DEPLOY_PATH: /data/grid_v4/grid_repo

jobs:
  verify:
    name: Pre-deploy Verification
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: griddb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Run critical tests
        env:
          DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/test_api.py tests/test_pit.py -v --tb=short -x --timeout=30

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify]
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')

    steps:
      - uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Pre-deploy state ==="
            git status --short
            git log --oneline -1

            echo "=== Pulling latest ==="
            git pull origin main

            echo "=== Installing Python deps ==="
            pip install -r requirements.txt --quiet

            echo "=== Building frontend ==="
            cd pwa && npm ci --quiet && npm run build && cd ..

            echo "=== Running migrations ==="
            python -m alembic upgrade head 2>/dev/null || echo "No pending migrations"

            echo "=== Restarting services ==="
            sudo systemctl restart grid-api

            echo "=== Health check ==="
            sleep 3
            curl -sf http://localhost:8000/api/v1/system/health || echo "Health check pending..."

            echo "=== Deploy complete ==="
            git log --oneline -1

      - name: Notify success
        if: success()
        run: echo "Deployment successful"

      - name: Notify failure
        if: failure()
        run: echo "Deployment FAILED — check server logs"
