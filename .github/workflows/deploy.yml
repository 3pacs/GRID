name: Deploy to Grid Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test verification'
        required: false
        default: 'false'
      do_restart:
        description: 'Restart grid-api and grid-hermes after deploy'
        type: boolean
        required: false
        default: true
      skip_migrations:
        description: 'Skip alembic upgrade head (explicit opt-out only; never silent)'
        type: boolean
        required: false
        default: false

env:
  DEPLOY_PATH: /data/grid_v4/grid_release

jobs:
  verify:
    name: Pre-deploy Verification
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Start Postgres (resilient pull)
        run: |
          set -euo pipefail
          # GitHub-hosted runners pull service-container images from Docker Hub
          # *before any step runs*, so a flaky pull (registry-1.docker.io:
          # "context deadline exceeded") fails the whole job with no retry path.
          # Start Postgres manually instead, retrying the pull with backoff.
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:15; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::docker pull postgres:15 failed after 5 attempts"
              exit 1
            fi
            backoff=$(( attempt * 5 ))
            echo "::warning::docker pull postgres:15 failed (attempt ${attempt}/5); retrying in ${backoff}s"
            sleep "${backoff}"
          done
          docker run -d --name grid-postgres \
            -e POSTGRES_USER=grid \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=griddb_test \
            -p 5432:5432 \
            postgres:15

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker exec grid-postgres pg_isready -U grid -d griddb_test >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready in time"
          docker logs grid-postgres || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Run critical tests
        env:
          DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          # config.py now rejects an empty DB_PASSWORD unconditionally (see
          # the 2026-09-13 incident) — must match the postgres container
          # password above so Settings() construction doesn't fail collection.
          DB_PASSWORD: testpass
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/test_api.py tests/test_pit.py -v --tb=short -x --timeout=30

  deploy:
    name: Deploy
    runs-on: [self-hosted, grid-svr]
    needs: [verify]
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')

    steps:
      - name: Build release tree
        env:
          SRC_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "before: $(git log --oneline -1)"
          # Fetch from GitHub itself with the job token, not from whatever `origin`
          # points at: the clone's origin went stale in 2026 and every deploy after
          # #364 reset to the same old commit while reporting success.
          git fetch "$SRC_URL" main
          git reset --hard FETCH_HEAD
          echo "after:  $(git log --oneline -1)"
          # A merge burst (several PRs landing within a minute) means an older run's
          # `main` fetch can already be a strict ancestor of a newer commit that merged
          # in the meantime — the release tree still contains the pushed commit, it's
          # just not HEAD anymore. Accept "pushed commit is an ancestor of HEAD" instead
          # of requiring exact equality, so only the newest run (which is what should
          # deploy anyway) needs to pass.
          git merge-base --is-ancestor "${{ github.sha }}" HEAD || { echo "::error::release tree is not at the pushed commit ${{ github.sha }}"; exit 1; }
          pip install -r requirements.txt
          cd pwa && npm ci && npm run build && cd ..
          if [ "${{ inputs.skip_migrations }}" = "true" ]; then
            echo "::warning::alembic upgrade head skipped via workflow_dispatch input skip_migrations=true"
          else
            # Source the same GRID .env candidates ops-exec.yml uses so alembic gets DB
            # credentials — the release tree carries no .env of its own, which is why
            # every deploy before this one failed on "no password supplied" (or, before
            # PR #443, on the divergent alembic heads) and had the failure swallowed by
            # `|| echo "no migrations"`. No migration has ever actually been applied by
            # a deploy; echo only which file was sourced, never its contents.
            for f in /data/grid_v4/grid_release/.env /home/grid/grid_v4/grid_repo/.env /home/grid/grid_v4/grid_repo/grid/.env; do
              if [ -f "$f" ]; then set -a; . "$f"; set +a; echo "(env sourced from $f)"; break; fi
            done
            {
              echo "## Alembic"
              echo '### current (before upgrade)'
              echo '```'
              python3 -m alembic current
              echo '```'
              echo '### heads'
              echo '```'
              python3 -m alembic heads
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            python3 -m alembic upgrade head
            # ...and again afterwards. Without this the summary records only
            # where the database *was*: `alembic current` before the upgrade,
            # and then silence. Run 641 is the case -- the upgrade ran, a
            # revision took its deferral branch, and the log showed neither
            # which revisions were applied nor where head ended up. A deploy
            # that migrates the production database should say so in its own
            # record.
            {
              echo '### current (after upgrade)'
              echo '```'
              python3 -m alembic current
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restart grid-api
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/systemd/system/grid-api.service.d
          printf '%s\n' '[Service]' "WorkingDirectory=$DEPLOY_PATH" | sudo tee /etc/systemd/system/grid-api.service.d/zz-release-worktree.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart grid-api

      - name: Verify running API (health + OpenAPI)
        run: |
          set -euo pipefail
          # grid-api imports the whole intelligence tree at startup; on
          # 2026-09-10 it took 96 s to start listening and the 90 s window
          # failed a deploy that had actually landed. Allow four minutes.
          for attempt in {1..120}; do
            if curl -fsS http://localhost:8000/api/v1/system/health; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "grid-api did not pass health check after restart"
              sudo systemctl status grid-api --no-pager -l || true
              journalctl -u grid-api -n 120 --no-pager || true
              exit 1
            fi
            sleep 2
          done
          echo
          fail() { echo "::error::verify failed: $*"; exit 1; }
          api_pid="$(systemctl show -p MainPID --value grid-api)"
          cwd="$(sudo -n readlink "/proc/${api_pid}/cwd" 2>/dev/null || readlink "/proc/${api_pid}/cwd" 2>/dev/null || true)"
          echo "grid-api pid=$api_pid cwd=$cwd"
          [ "$cwd" = "$DEPLOY_PATH" ] || fail "grid-api cwd '$cwd' != $DEPLOY_PATH"
          curl -fsS http://localhost:8000/ > /tmp/grid-index.html || fail "GET / failed"
          index_js="$(grep -o '/assets/index-[^"]*\.js' /tmp/grid-index.html | head -1 || true)"
          echo "index asset: ${index_js:-<none>}"
          [ -n "$index_js" ] || fail "no /assets/index-*.js in index.html (PWA build missing?)"
          curl -fsS "http://localhost:8000${index_js}" > /tmp/grid-index.js || fail "GET $index_js failed"
          # The gold stream client may live in a lazily loaded chunk after code-splitting; check all served chunks.
          if ! grep -qF '/gold/stream' /tmp/grid-index.js; then
            found=0
            for chunk in $(grep -o '/assets/[^"]*\.js' /tmp/grid-index.html | sort -u); do
              curl -fsS "http://localhost:8000${chunk}" 2>/dev/null | grep -qF '/gold/stream' && { found=1; echo "gold stream client found in $chunk"; break; }
            done
            [ "$found" = 1 ] || grep -rqF '/gold/stream' "$DEPLOY_PATH/pwa_dist/assets" || fail "'/gold/stream' not in any built PWA chunk"
          fi
          curl -fsS http://localhost:8000/openapi.json > /tmp/grid-openapi.json || fail "GET /openapi.json failed"
          grep -qF '"/api/v1/intelligence/actor-network"' /tmp/grid-openapi.json || fail "actor-network route missing from OpenAPI"
          grep -qF '"/api/v1/dad/ticker/{ticker}/gold/stream"' /tmp/grid-openapi.json || fail "gold/stream route missing from OpenAPI"
          grep -qF '"/api/v1/conviction/sweeps/latest"' /tmp/grid-openapi.json || fail "sweeps/latest route missing from OpenAPI (Sprint 3 not live)"
          echo "verify: all assertions passed"

      # grid-hermes runs `ExecStart=/usr/bin/python3 scripts/hermes_operator.py`
      # with a RELATIVE path, resolved against WorkingDirectory. Its unit pins
      # that to the Hermes tree, which no deploy writes to -- so every
      # Hermes-side change has shipped to grid_release and then not run. #487
      # (2026-09-13) and #490 (2026-09-14) both sat deployed-but-inert for
      # exactly that reason: on 2026-09-14 the live process was still on
      # 5facbdf0, started 2026-09-11, with zero occurrences of
      # DISTINCT_SCAN_SLICE_HOURS or RESOLUTION_SCAN_BUDGET_SECONDS.
      #
      # This is the same drop-in grid-api already gets, so both services run the
      # tree this workflow actually deployed. Placed after the API verify: if the
      # API did not come back healthy, stop before bouncing a second service.
      - name: Restart grid-hermes
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/systemd/system/grid-hermes.service.d
          printf '%s\n' '[Service]' "WorkingDirectory=$DEPLOY_PATH" | sudo tee /etc/systemd/system/grid-hermes.service.d/zz-release-worktree.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart grid-hermes

      # Prove it is running the DEPLOYED tree, not merely that it is alive. A
      # bare `is-active` would have reported green through the whole period the
      # daemon ran three-day-old code, which is the failure this exists to make
      # impossible.
      - name: Verify grid-hermes runs the deployed tree
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            state="$(systemctl is-active grid-hermes || true)"
            [ "$state" = "active" ] && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::grid-hermes not active after restart (state=$state)"
              sudo systemctl status grid-hermes --no-pager -l || true
              journalctl -u grid-hermes -n 60 --no-pager || true
              exit 1
            fi
            sleep 2
          done
          pid="$(systemctl show -p MainPID --value grid-hermes)"
          cwd="$(sudo -n readlink "/proc/${pid}/cwd" 2>/dev/null || readlink "/proc/${pid}/cwd" 2>/dev/null || true)"
          echo "grid-hermes pid=$pid cwd=$cwd"
          # DEPLOY_PATH is reached through a symlink on this host, so compare
          # resolved paths rather than the literal strings.
          want="$(readlink -f "$DEPLOY_PATH")"
          [ -n "$cwd" ] && [ "$(readlink -f "$cwd")" = "$want" ] || {
            echo "::error::grid-hermes cwd '$cwd' does not resolve to $want -- it is running a different tree"
            exit 1
          }
          echo "verify: grid-hermes is running the deployed tree"

      # grid-scheduler has the exact same class of bug the grid-hermes fix
      # above addressed for #487/#490: its unit pins WorkingDirectory to
      # /home/grid/grid_v4/grid_repo, a separate checkout this workflow never
      # writes to. Confirmed 2026-09-15: grid_repo's HEAD (5facbdf0, dated
      # 2026-09-11) predates every PR merged today (#368/#370/#382/#383/#489/
      # #495/#498) and isn't even reachable on GitHub (a local-only merge
      # commit) -- its own `origin` remote can't authenticate (SSH key
      # rejected) either, so it can't self-heal. Confirmed live: the running
      # scheduler was still hitting the exact unbounded-query timeout #498
      # fixes, on ^DJI/^VIX6M/HG=F/GC=F, hours after grid-api/grid-hermes had
      # already redeployed successfully.
      #
      # Fix is the same release-path drop-in pattern as grid-api/grid-hermes
      # above -- only WorkingDirectory moves to $DEPLOY_PATH. EnvironmentFile
      # deliberately stays on grid_repo/.env, same reason grid-api/grid-hermes
      # keep it there too: grid_release carries no .env of its own. Confirmed
      # grid-scheduler shares the same interpreter and dependencies as
      # grid-api/grid-hermes (bare /usr/bin/python3.10, no venv, one shared
      # system site-packages -- e.g. tqdm is already 4.70.1 system-wide) so
      # this is purely a working-directory fix, not an environment migration.
      # The scheduler's own connection-pool override
      # (grid-scheduler.service.d/pool-budget.conf, EnvironmentFile= only) is
      # untouched by this -- different directive key, no collision.
      - name: Restart grid-scheduler
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/systemd/system/grid-scheduler.service.d
          printf '%s\n' '[Service]' "WorkingDirectory=$DEPLOY_PATH" | sudo tee /etc/systemd/system/grid-scheduler.service.d/zz-release-worktree.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart grid-scheduler

      # Same proof-of-tree pattern as the grid-hermes verify above -- a bare
      # is-active would stay green through the whole time the scheduler ran
      # stale code, which is exactly the failure this exists to catch.
      - name: Verify grid-scheduler runs the deployed tree
        if: ${{ github.event_name == 'push' || inputs.do_restart == true }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            state="$(systemctl is-active grid-scheduler || true)"
            [ "$state" = "active" ] && break
            if [ "$attempt" -eq 30 ]; then
              echo "::error::grid-scheduler not active after restart (state=$state)"
              sudo systemctl status grid-scheduler --no-pager -l || true
              journalctl -u grid-scheduler -n 60 --no-pager || true
              exit 1
            fi
            sleep 2
          done
          pid="$(systemctl show -p MainPID --value grid-scheduler)"
          cwd="$(sudo -n readlink "/proc/${pid}/cwd" 2>/dev/null || readlink "/proc/${pid}/cwd" 2>/dev/null || true)"
          echo "grid-scheduler pid=$pid cwd=$cwd"
          want="$(readlink -f "$DEPLOY_PATH")"
          [ -n "$cwd" ] && [ "$(readlink -f "$cwd")" = "$want" ] || {
            echo "::error::grid-scheduler cwd '$cwd' does not resolve to $want -- it is running a different tree"
            exit 1
          }
          echo "verify: grid-scheduler is running the deployed tree"

      - name: Notify success
        if: success()
        run: echo "Deployment successful"

      - name: Notify failure
        if: failure()
        run: echo "Deployment FAILED - check server logs"

  dad-smoke:
    name: Dad Path Smoke (post-deploy, report-only)
    needs: [deploy]
    # Report-only (strict: false) until the dad-path smoke test has a track record on
    # real deploys — a failure here does not fail this workflow. Same gating as the
    # restart step: only meaningful right after a deploy that actually restarted
    # grid-api, and only if that deploy succeeded.
    if: needs.deploy.result == 'success' && (github.event_name == 'push' || inputs.do_restart == true)
    uses: ./.github/workflows/dad-smoke.yml
    with:
      base_url: http://127.0.0.1:8000
      strict: false
