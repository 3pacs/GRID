# SOURCE PROPOSAL ONLY: NOT_ADOPTED guard remains unconditional.
# Do not publish as a working isolation deployment before its qualification.
name: Deploy to Grid Server
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-grid-release
  cancel-in-progress: false
jobs:
  verify:
    name: Pre-deploy Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Start Postgres (resilient pull)
        run: |
          set -euo pipefail
          # GitHub-hosted runners pull service-container images from Docker Hub
          # *before any step runs*, so a flaky pull (registry-1.docker.io:
          # "context deadline exceeded") fails the whole job with no retry path.
          # Start Postgres manually instead, retrying the pull with backoff.
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:15; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::docker pull postgres:15 failed after 5 attempts"
              exit 1
            fi
            backoff=$(( attempt * 5 ))
            echo "::warning::docker pull postgres:15 failed (attempt ${attempt}/5); retrying in ${backoff}s"
            sleep "${backoff}"
          done
          docker run -d --name grid-postgres \
            -e POSTGRES_USER=grid \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=griddb_test \
            -p 5432:5432 \
            postgres:15

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if docker exec grid-postgres pg_isready -U grid -d griddb_test >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready in time"
          docker logs grid-postgres || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Run critical tests
        env:
          DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          # config.py now rejects an empty DB_PASSWORD unconditionally (see
          # the 2026-09-13 incident) — must match the postgres container
          # password above so Settings() construction doesn't fail collection.
          DB_PASSWORD: testpass
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest tests/test_api.py tests/test_pit.py -v --tb=short -x --timeout=30

  bundle:
    name: Prepare independently qualified API bundle
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build exact API bundle through isolated producer interface
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/deploy_build_hook.sh api-isolated "$EXPECTED_COMMIT" --execute

  deploy:
    name: Deploy isolated API
    needs: [verify, bundle]
    # PROPOSED label: must not be registered until operator-bound runner identity,
    # work/temp roots and capabilities are disjoint from every held path BEFORE
    # any job starts. Runner script/env files are writes even without checkout.
    runs-on: [self-hosted, grid-svr, grid-api-isolated]
    steps:
      # No target checkout. Only a separately adopted immutable stable adapter.
      - name: Activate exact isolated API bundle
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          /data/grid_v4/api-isolated/bootstrap/bin/python3.10 -I -S -B \
            /data/grid_v4/api-isolated/bootstrap/deploy_api_isolated.py \
            --binding "/data/grid_v4/api-isolated/control/$EXPECTED_COMMIT/binding.json" \
            --expected-commit "$EXPECTED_COMMIT" --execute

  dad-smoke:
    name: Dad Path Smoke (post-deploy, report-only)
    needs: [deploy]
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/dad-smoke.yml
    with:
      base_url: http://127.0.0.1:8000
      strict: false
