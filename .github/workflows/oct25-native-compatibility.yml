name: G3 G5 forward and compatible HOLD qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: g3-g5-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  g3-g5-native:
    name: G3 G5 Python${{ matrix.python }} PG${{ matrix.pg }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ["3.10.12", "3.11"]
        pg: ["14", "15"]
    defaults:
      run:
        working-directory: forward
    env:
      # DRAFT: these exact reviewed bindings MUST be replaced before publication.
      HOLD_SHA: 4f5be1b007378ba973cf834485b6d5bfc4a5e73f
      THESIS_CASES: "72"
      PURE_CASES: "35"
      GRID_OCT25_PG_MAJOR: ${{ matrix.pg }}
      DB_HOST: 127.0.0.1
      DB_PORT: "15432"
      DB_NAME: oct25_native_test
      DB_USER: oct25_ci_writer
      GRID_OCT25_REQUIRE_PG: "1"
      GRID_JWT_SECRET: synthetic-ci-only
      TESTING: "true"
      GRID_GIT_SINK_DISABLED: "1"
      GIT_SINK_PUSH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: forward

      - name: Refuse unbound source or counts before setup
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch('[0-9a-f]{40}', os.environ['HOLD_SHA']), 'UNBOUND_HOLD'
          assert int(os.environ['THESIS_CASES']) > 0 and int(os.environ['PURE_CASES']) > 0
          from pathlib import Path
          receipt = Path(os.environ['RUNNER_TEMP']) / 'g3-g5-rollback.json'
          assert receipt.is_absolute()
          assert not any(c in str(receipt) for c in ('\r', '\n'))
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write(f'GRID_OCT25_ROLLBACK_RECEIPT={receipt}\n')
          PY

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HOLD_SHA }}
          path: hold
          persist-credentials: false

      - name: Verify sealed source bytes in both epochs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'forward': {'intelligence/schema_readiness.py': '05b7f230da4c1bb777bc6ec3bb7a549efbba4f02a99b0388d7d70174173cf3c5', 'intelligence/thesis_schema.py': '6c8d6360b4d173cb38ac50de27b66dee5990b1b2a200ba093a1b446dec950081', 'intelligence/thesis_tracker.py': '4f78c9f7b8f44d76cef4d23415f97c3e21691690f8288086862433354a8cd3bd', 'analysis/thesis_scorer.py': '13398504b1b98a46e50f09c81a74854d54a5d0d70626c7fe549e87dcfa0573e9', 'intelligence/adapters/thesis_tracker_adapter.py': 'f0ad1077adaf68dc1b907dce7d7e978ace0b652a197eb1d7e325d240ad9232bf', 'tests/test_thesis_schema_readiness.py': '149fea78987b1a733b9576dfcc382157e460070de783a5b5d6fa9945cc0ddde1', 'tests/test_oct25_thesis_native_compatibility.py': 'b99a5c28b700fd04d9f6bf61387ed8ba89fbde1059204e5e303850914b2a4f52', 'tests/test_oct25_thesis_rollback_phase.py': '2920e37b345975e08ac1ee27efa060ab220f451c8fcc879e478b30a6154c6261', 'analysis/flow_thesis_scoring.py': '748ec45e12abbe50820c276d3aa14ad80e11bf8be8d46bcedeaa51abc255e225', 'intelligence/runtime_schema.py': 'd9dc787c13754355e5e755807f1ef73c14cf069dde6b062f724e705b56155103', 'ollama/market_briefing.py': '7d6b17c66148081890ff8b0d8a123b6567863853f2c0a6e66c8a4f116df901ef', 'tests/test_oct25_publication_native_compatibility.py': 'b5d5231d5177260ce63a562fa338c4a51494b53e76b10e175f418fa4506ef630'}, 'hold': {'intelligence/schema_readiness.py': '05b7f230da4c1bb777bc6ec3bb7a549efbba4f02a99b0388d7d70174173cf3c5', 'intelligence/thesis_schema.py': '6c8d6360b4d173cb38ac50de27b66dee5990b1b2a200ba093a1b446dec950081', 'intelligence/thesis_tracker.py': '3300600f61724ad972e9f94cb2b3d8370a86a72dac8dd7eabb1f65d984a6e998', 'analysis/thesis_scorer.py': 'e83641861785f0f1b9053568337193d9b71e4a58b1112c54d5c67cee8beef83f', 'intelligence/adapters/thesis_tracker_adapter.py': 'f0ad1077adaf68dc1b907dce7d7e978ace0b652a197eb1d7e325d240ad9232bf', 'tests/test_thesis_schema_readiness.py': '149fea78987b1a733b9576dfcc382157e460070de783a5b5d6fa9945cc0ddde1', 'tests/test_oct25_thesis_native_compatibility.py': '074d6749eea7d3da21bfaa440c9dc0a0432b659a184edbe94e87a3be08336bc1', 'tests/test_oct25_thesis_rollback_phase.py': '2920e37b345975e08ac1ee27efa060ab220f451c8fcc879e478b30a6154c6261', 'analysis/flow_thesis_scoring.py': '748ec45e12abbe50820c276d3aa14ad80e11bf8be8d46bcedeaa51abc255e225', 'intelligence/runtime_schema.py': 'd9dc787c13754355e5e755807f1ef73c14cf069dde6b062f724e705b56155103', 'ollama/market_briefing.py': '7d6b17c66148081890ff8b0d8a123b6567863853f2c0a6e66c8a4f116df901ef', 'tests/test_oct25_publication_native_compatibility.py': 'b5d5231d5177260ce63a562fa338c4a51494b53e76b10e175f418fa4506ef630'}}
          for epoch, files in expected.items():
              root = Path('.') if epoch == 'forward' else Path('../hold')
              for path, digest in files.items():
                  assert hashlib.sha256((root/path).read_bytes()).hexdigest() == digest, (epoch,path)
          PY

      - name: Record receiving checkout
        env:
          EXPECTED_CHECKOUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT"
          git show -s --format='checkout=%H tree=%T parents=%P'

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install existing project test dependencies
        timeout-minutes: 10
        run: python -m pip install -r requirements.txt

      - name: Generate ephemeral job-only database credentials
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          import re
          admin = secrets.token_hex(32)
          writer = secrets.token_hex(32)
          runtime = secrets.token_hex(32)
          assert re.fullmatch(r'[0-9a-f]{64}', admin)
          assert re.fullmatch(r'[0-9a-f]{64}', writer)
          assert re.fullmatch(r'[0-9a-f]{64}', runtime)
          assert len({admin, writer, runtime}) == 3
          # GitHub's interpreted masking protocol is the only credential output.
          # Flush both registrations before environment handoff/step headers.
          print(f'::add-mask::{admin}', flush=True)
          print(f'::add-mask::{writer}', flush=True)
          print(f'::add-mask::{runtime}', flush=True)
          url = f'postgresql://oct25_ci_writer:{writer}@127.0.0.1:15432/oct25_native_test'
          # Runner-owned environment handoff stays inside this disposable job.
          # No ordinary credential logging, argv values, or uploaded env file.
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              for key, value in {'POSTGRES_PASSWORD': admin, 'DB_PASSWORD': writer,
                                 'GRID_TEST_DB_URL': url, 'GRID_OCT25_TEST_DB_URL': url,
                                 'GRID_OCT25_RUNTIME_DB_URL': f'postgresql://oct25_ci_runtime:{runtime}@127.0.0.1:15432/oct25_native_test'}.items():
                  output.write(f'{key}={value}\n')
          PY

      # Hosted disposable VM only. Host networking makes the server-side address
      # genuinely127.0.0.1; Docker port publishing would expose a172.* server address
      # and fail the unchanged fixture. PG listens only on loopback port15432.
      - name: Start isolated synthetic PostgreSQL
        timeout-minutes: 3
        run: |
          set -euo pipefail
          docker run --detach --name oct25-synthetic-pg --network host \
            --label grid-purpose=oct25-synthetic-ci \
            -e POSTGRES_USER=oct25_ci_admin \
            -e POSTGRES_PASSWORD \
            -e POSTGRES_DB=postgres \
            "postgres:${{ matrix.pg == '14' && '14.24' || '15' }}" -c listen_addresses=127.0.0.1 -c port=15432
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec oct25-synthetic-pg pg_isready -h 127.0.0.1 -p 15432 -U oct25_ci_admin -d postgres; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          python - <<'PY'
          import os
          import re
          import psycopg2
          from psycopg2 import sql
          admin, writer = os.environ['POSTGRES_PASSWORD'], os.environ['DB_PASSWORD']
          assert re.fullmatch(r'[0-9a-f]{64}', admin)
          assert re.fullmatch(r'[0-9a-f]{64}', writer)
          assert admin != writer
          connection = psycopg2.connect(host='127.0.0.1', port=15432, dbname='postgres',
                                        user='oct25_ci_admin', password=admin, connect_timeout=5)
          try:
              connection.autocommit = True
              with connection.cursor() as cursor:
                  cursor.execute(sql.SQL("CREATE ROLE oct25_ci_writer LOGIN PASSWORD {} NOSUPERUSER NOCREATEROLE NOCREATEDB NOREPLICATION").format(sql.Literal(writer)))
                  from sqlalchemy.engine import make_url
                  runtime = make_url(os.environ['GRID_OCT25_RUNTIME_DB_URL']).password
                  assert re.fullmatch(r'[0-9a-f]{64}', runtime)
                  assert len({admin, writer, runtime}) == 3
                  cursor.execute(sql.SQL("CREATE ROLE oct25_ci_runtime LOGIN PASSWORD {} NOSUPERUSER NOCREATEROLE NOCREATEDB NOREPLICATION").format(sql.Literal(runtime)))
                  cursor.execute("CREATE DATABASE oct25_native_test OWNER oct25_ci_writer")
                  cursor.execute("COMMENT ON DATABASE oct25_native_test IS 'grid-oct25-synthetic-ci-only'")
          finally:
              connection.close()
          PY
          docker inspect --format='image={{.Image}} network={{.HostConfig.NetworkMode}} purpose={{index .Config.Labels "grid-purpose"}}' oct25-synthetic-pg

      - name: Verify synthetic identity before tests
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          import re
          password = os.environ['DB_PASSWORD']
          assert re.fullmatch(r'[0-9a-f]{64}', password)
          expected = f'postgresql://oct25_ci_writer:{password}@127.0.0.1:15432/oct25_native_test'
          assert os.environ['GRID_TEST_DB_URL'] == expected
          assert os.environ['GRID_OCT25_TEST_DB_URL'] == expected
          engine = create_engine(expected, connect_args={'connect_timeout': 5})
          try:
              with engine.connect() as conn:
                  identity = conn.execute(text("SELECT current_database(), current_user, host(inet_server_addr()), inet_server_port(), current_setting('server_version_num')::int, rolsuper, rolcreaterole, rolcreatedb, rolreplication FROM pg_roles WHERE rolname=current_user")).one()
                  assert tuple(identity[:4]) == ('oct25_native_test', 'oct25_ci_writer', '127.0.0.1', 15432), identity
                  assert identity[4] // 10000 == int(os.environ['GRID_OCT25_PG_MAJOR']), identity
                  assert tuple(identity[5:]) == (False, False, False, False), identity
                  marker = conn.execute(text("SELECT shobj_description(oid,'pg_database') FROM pg_database WHERE datname=current_database()")).scalar_one()
                  assert marker == 'grid-oct25-synthetic-ci-only', marker
                  import json
                  from pathlib import Path
                  Path('oct25-native-identity.json').write_text(json.dumps({'observed_identity': list(identity), 'marker': marker})+'\n')
                  print('Synthetic PG identity verified:', tuple(identity))
          finally:
              engine.dispose()
          PY

      - name: Record runtime and Settings binding
        timeout-minutes: 1
        env:
          POSTGRES_PASSWORD: ""
        run: |
          python - <<'PY'
          import hashlib, importlib.metadata, json, os, platform, subprocess
          from pathlib import Path
          import sys
          requested = "${{ matrix.python }}"
          assert tuple(sys.version_info[:3]) == (3,10,12) if requested == "3.10.12" else tuple(sys.version_info[:2]) == (3,11)
          assert subprocess.check_output(['git','-C','../hold','rev-parse','HEAD'],text=True).strip() == os.environ['HOLD_SHA']
          from config import Settings
          expected = os.environ['GRID_OCT25_TEST_DB_URL']
          assert Settings().DB_URL == expected
          assert os.environ['GRID_TEST_DB_URL'] == expected
          assert not os.environ.get('POSTGRES_PASSWORD')
          data = {
              'checkout': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(),
              'python': platform.python_version(), 'platform': platform.platform(),
              'packages': {p: importlib.metadata.version(p) for p in ['pytest','pytest-timeout','pytest-xdist','SQLAlchemy','psycopg2-binary']},
              'requirements_sha256': hashlib.sha256(Path('requirements.txt').read_bytes()).hexdigest(),
              'identity': json.loads(Path('oct25-native-identity.json').read_text()),
              'image_tag': 'postgres:14.24' if os.environ['GRID_OCT25_PG_MAJOR']=='14' else 'postgres:15',
              'settings_binding_verified': True, 'admin_credential_absent_from_test_step': True,
              'commands': {'forward': 'pytest publication+thesis+readiness; serial; timeout60; external600s', 'seed': 'phase=forward; serial; external150s', 'hold': 'phase=hold; separate checkout/process; external150s', 'cleanup': 'phase=cleanup; always; external90s'},
              'hold_checkout': os.environ['HOLD_SHA'],
              'hold_tree': subprocess.check_output(['git','-C','../hold','rev-parse','HEAD^{tree}'],text=True).strip(),
              'image_id': subprocess.check_output(['docker','inspect','--format={{.Image}}','oct25-synthetic-pg'],text=True).strip(),
          }
          Path('oct25-native-runtime.json').write_text(json.dumps(data, indent=2)+'\n')
          print(json.dumps(data, indent=2))
          PY

      - name: Forward native and readiness cases
        timeout-minutes: 10
        env:
          POSTGRES_PASSWORD: ""
        run: |
          timeout --signal=TERM --kill-after=10s 600s python -m pytest -q --tb=short -o addopts= --timeout=60 --timeout-method=thread -n 0 --junitxml=forward-results.xml \
            tests/test_oct25_publication_native_compatibility.py tests/test_oct25_thesis_native_compatibility.py tests/test_thesis_schema_readiness.py

      - name: Seed forward rollback state
        timeout-minutes: 3
        env:
          POSTGRES_PASSWORD: ""
          GRID_OCT25_ROLLBACK_PHASE: forward
        run: timeout --signal=TERM --kill-after=10s 150s python -m pytest -q --tb=short -o addopts= --timeout=60 --timeout-method=thread -n 0 --junitxml=phase-forward.xml tests/test_oct25_thesis_rollback_phase.py

      - name: Qualify HOLD on same state
        timeout-minutes: 3
        working-directory: hold
        env:
          POSTGRES_PASSWORD: ""
          GRID_OCT25_ROLLBACK_PHASE: hold
        run: timeout --signal=TERM --kill-after=10s 150s python -m pytest -q --tb=short -o addopts= --timeout=60 --timeout-method=thread -n 0 --junitxml=phase-hold.xml tests/test_oct25_thesis_rollback_phase.py

      - name: Cleanup phase schema even after failure
        if: always()
        timeout-minutes: 2
        env:
          POSTGRES_PASSWORD: ""
          GRID_OCT25_ROLLBACK_PHASE: cleanup
        run: timeout --signal=TERM --kill-after=10s 90s python -m pytest -q --tb=short -o addopts= --timeout=60 --timeout-method=thread -n 0 --junitxml=phase-cleanup.xml tests/test_oct25_thesis_rollback_phase.py

      - name: Require every exact case and epoch receipt
        if: always()
        timeout-minutes: 1
        env:
          POSTGRES_PASSWORD: ""
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          inputs = {
              'forward-results.xml': {'tests.test_oct25_publication_native_compatibility':43,
                                     'tests.test_oct25_thesis_native_compatibility':int(os.environ['THESIS_CASES']),
                                     'tests.test_thesis_schema_readiness':int(os.environ['PURE_CASES'])},
              'phase-forward.xml': {'tests.test_oct25_thesis_rollback_phase':1},
              '../hold/phase-hold.xml': {'tests.test_oct25_thesis_rollback_phase':1},
              'phase-cleanup.xml': {'tests.test_oct25_thesis_rollback_phase':1},
          }
          receipts = []
          for filename, expected in inputs.items():
              item = {'file':filename,'expected':expected,'passed':False}
              try:
                  root = ET.parse(filename).getroot()
                  cases = root.findall('.//testcase')
                  names = [(c.get('classname',''),c.get('name','')) for c in cases]
                  counts = {}
                  for c in cases:
                      name = c.get('classname','')
                      module = next((m for m in expected if name==m or name.startswith(m+'.')),name)
                      counts[module] = counts.get(module,0)+1
                  item.update(counts=counts, cases=len(cases), skips=len(root.findall('.//skipped')),
                              errors=len(root.findall('.//error')), failures=len(root.findall('.//failure')))
                  item['passed'] = bool(cases) and len(set(names))==len(names) and counts==expected and not any(item[k] for k in ('skips','errors','failures'))
              except (OSError,ET.ParseError) as error:
                  item['receipt_error'] = type(error).__name__
              receipts.append(item)
          Path('oct25-native-summary.json').write_text(json.dumps(receipts,indent=2)+'\n')
          print(json.dumps(receipts,indent=2))
          assert all(r['passed'] for r in receipts), 'INCOMPLETE_OR_FAILED_NATIVE_EPOCH'
          PY

      - name: Destroy synthetic database container and volume
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          if docker container inspect oct25-synthetic-pg >/dev/null 2>&1; then
            test "$(docker inspect --format='{{index .Config.Labels "grid-purpose"}}' oct25-synthetic-pg)" = oct25-synthetic-ci
            timeout 30s docker rm --force --volumes oct25-synthetic-pg
          fi
          test -z "$(docker ps -aq --filter name='^/oct25-synthetic-pg$')"

      - name: Retain only native runtime and count metadata
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v7.0.2
        with:
          name: g3-g5-metadata-py${{ matrix.python }}-pg${{ matrix.pg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            forward/oct25-native-runtime.json
            forward/oct25-native-summary.json
          if-no-files-found: error
          retention-days: 7

