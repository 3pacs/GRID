name: GRID Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # jsdom 30 (see #506) needs >=22.22.2 on the 22.x line; 22.22.1 no longer
  # satisfies it. Pinned to the exact version deploy.yml's "Build release
  # tree" step also requests via actions/setup-node (see that workflow) --
  # one explicit version shared by CI and production, rather than two
  # independently-drifting definitions of "a Node 22". Both pins are scoped
  # to their own workflow job via actions/setup-node's tool-cache, not
  # grid-svr's global Node install (still whatever `node -v` shows there
  # outside of a workflow run). pwa/.npmrc's engine-strict=true is the
  # actual enforcement against a real package's engines range (jsdom 30 and
  # vitest 5 both included) in both places -- this pin is about keeping CI
  # and the deploy build on the same version, not the safety check itself.
  NODE_VERSION: "22.23.2"
  # Non-empty -> target the alien self-hosted runner; empty/unset -> ubuntu-latest.
  # Set via Settings > Secrets and variables > Actions > Variables > TEST_RUNNER.
  ON_ALIEN: ${{ vars.TEST_RUNNER != '' }}

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ${{ vars.TEST_RUNNER != '' && fromJSON('["self-hosted","alien","tests"]') || 'ubuntu-latest' }}
    # alien (Xeon E5-2698 v3) is ~2x slower per core than ubuntu-latest: the
    # suite takes ~14.5 min there and TestGauntlet::test_run_gauntlet alone
    # takes ~90 s, so both timeouts need headroom (measured 2026-09-11).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ubuntu-latest is a fresh VM every run, so bring up an ephemeral
      # Postgres container. alien keeps a persistent PostgreSQL 15 +
      # TimescaleDB service (see docs/SERVER-SERVICES.md, "Alien Runner")
      # that the next step resets instead of pulling+starting a container.
      - name: Start ephemeral Postgres (hosted runner)
        if: env.ON_ALIEN != 'true'
        run: |
          docker run -d --name grid-test-pg \
            -e POSTGRES_USER=grid -e POSTGRES_PASSWORD=testpass -e POSTGRES_DB=griddb_test \
            -p 5432:5432 postgres:15
          for i in $(seq 1 30); do
            docker exec grid-test-pg pg_isready -U grid > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Reset persistent Postgres (alien)
        if: env.ON_ALIEN == 'true'
        env:
          PGPASSWORD: testpass
        run: |
          psql -h localhost -U grid -d griddb_test -c \
            'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run tests
        env:
          DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          # config.py now rejects an empty DB_PASSWORD unconditionally (see
          # the 2026-09-13 incident) — must match the postgres service
          # password above so Settings() construction doesn't fail collection.
          DB_PASSWORD: testpass
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: |
          set +e
          python -m pytest tests/ -v --tb=short --co -q > /tmp/grid-pytest-collection.txt 2>/tmp/grid-pytest-collection.err
          collection_status=$?
          set -e
          head -20 /tmp/grid-pytest-collection.txt
          if [ "$collection_status" -ne 0 ]; then
            # pytest writes collection errors (ImportError, etc.) to stdout — the
            # .txt file — and the `=== ERRORS ===` block lives at the tail, past
            # the 20-line head. Surface the tail of stdout AND the (usually empty)
            # stderr so future collection failures aren't invisible like the
            # 2026-05-17 trust_scorer import regression.
            echo "::group::pytest collection error (tail of stdout)"
            tail -200 /tmp/grid-pytest-collection.txt
            echo "::endgroup::"
            echo "::group::pytest collection stderr"
            cat /tmp/grid-pytest-collection.err
            echo "::endgroup::"
            exit "$collection_status"
          fi

          # -n auto: one worker per core (24 on alien, 4 on ubuntu-latest).
          # --dist loadgroup honours the xdist_group markers tests/conftest.py
          # assigns: every test that can reach a live PostgreSQL shares one
          # group and so runs serially on a single worker, and every other test
          # is grouped by its file so a module's tests stay together and in
          # order. See the block comment in tests/conftest.py for why.
          # --durations=25 surfaces the slowest tests so the next round of
          # tuning has numbers instead of guesses.
          set +e
          python -m pytest tests/ -v --tb=short --maxfail=50 --timeout=180 \
            -n auto --dist loadgroup --durations=25 \
            > /tmp/grid-pytest-output.txt 2>&1
          pytest_status=$?
          set -e

          # tail -30 truncated 2 of 16 failures from the 2026-05-17 run.
          # Bump to 300 lines + wrap in a collapsed group so the full
          # pytest summary (FAILED list + short tracebacks) survives.
          echo "::group::pytest output (tail -300)"
          tail -300 /tmp/grid-pytest-output.txt
          echo "::endgroup::"
          exit "$pytest_status"

      # The general suite leaves GRID_TEST_DB_URL unset. Gate both producer
      # and resolver contracts against the isolated disposable PG schemas.
      # test_spy_binance_composition_pg.py proves the two policies resolve
      # correctly TOGETHER in one Resolver.resolve_pending() call -- the
      # actual composition question this branch exists to answer -- and was
      # added after this step was first written; it was never in this list
      # and so never actually ran in CI despite CI reporting green.
      - name: SPY and Binance close PostgreSQL contracts
        env:
          GRID_TEST_DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          DB_PASSWORD: testpass
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: python -m pytest tests/test_spy_price_receipt_pg.py tests/test_binance_canonical_close_pg.py tests/test_spy_binance_composition_pg.py -q -rA

      - name: Dad gold read-only PostgreSQL contract
        env:
          GRID_TEST_DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          DB_PASSWORD: testpass
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: python -m pytest tests/test_dad_gold_readonly_pg.py -q -rA

      - name: Check for SQL injection patterns
        run: |
          echo "Checking for unsafe SQL patterns..."
          if grep -rn '\.format(' api/ store/ intelligence/ --include="*.py" | grep -i "select\|insert\|update\|delete\|where" | grep -v "# safe" | grep -v test; then
            echo "WARNING: Possible SQL injection patterns found (review above)"
          else
            echo "No SQL injection patterns detected"
          fi

      - name: Stop ephemeral Postgres (hosted runner)
        if: always() && env.ON_ALIEN != 'true'
        run: docker rm -f grid-test-pg 2>/dev/null || true

  frontend-build:
    name: Frontend Build
    runs-on: ${{ vars.TEST_RUNNER != '' && fromJSON('["self-hosted","alien","tests"]') || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        working-directory: pwa
        run: npm ci

      - name: TypeScript check
        working-directory: pwa
        run: npx tsc --noEmit

      # The vitest suites (routes registry, canvas store, live activity,
      # intelligence search, …) never ran in CI before 2026-09-10; tsc with
      # checkJs=false validates almost nothing, so this is the real gate.
      - name: Unit tests (vitest)
        working-directory: pwa
        run: npm run test

      - name: Build
        working-directory: pwa
        run: npm run build

      - name: Check bundle size
        working-directory: pwa
        run: |
          echo "Bundle size report:"
          du -sh dist/ 2>/dev/null || du -sh ../pwa_dist/ 2>/dev/null || echo "No dist found"
          find dist/ -name "*.js" -exec ls -lh {} \; 2>/dev/null | sort -k5 -h | tail -10 || true

  lint:
    name: Lint
    runs-on: ${{ vars.TEST_RUNNER != '' && fromJSON('["self-hosted","alien","tests"]') || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install ruff bandit

      # Style and unused-import noise across a 700+ module tree: too much to
      # gate on today, so this stays advisory and reports without failing.
      - name: Ruff lint (advisory)
        run: ruff check . --select E,W,F --ignore E501 --exit-zero

      # These are not style. Every rule here means the name does not exist at
      # runtime, so the code raises the moment it is reached.
      #
      # This gate exists because it was missing. #493 extracted build_snapshot()
      # into api/routers/astrogrid_helpers.py and left `timezone` behind in the
      # module it came from. Ruff's F821 flagged it, --exit-zero discarded the
      # finding, Lint went green, and the function raised NameError on every
      # Hermes cycle and every GET /astrogrid/snapshot in production.
      #
      # Every rule below is at zero on this tree, so the gate starts green and
      # only ever goes red on a new defect. `notebooks` is excluded: ruff reads
      # cross-cell names in .ipynb as undefined, which is a property of the
      # notebook model rather than a bug in the code.
      - name: Ruff lint (blocking — names that do not exist at runtime)
        run: ruff check . --select F821,F822,F823,F402,F501,F502,F632 --exclude notebooks

      - name: Obsidian wikilink integrity
        run: python scripts/obsidian_backlinks.py --check

      - name: Security scan (high severity)
        run: bandit -r api/ store/ intelligence/ -lll

      - name: Security scan (medium audit)
        run: bandit -r api/ store/ intelligence/ -ll --exit-zero

      # Failure-injection proof for scripts/deploy_release_swap.sh: a failed
      # build/migration must never leave the live release directory
      # half-updated. Runs entirely inside its own temp sandbox -- no
      # database, no grid-svr, no production path is touched. See
      # tests/deploy/test_deploy_release_swap.sh's own header for what each
      # case proves.
      - name: Deploy pipeline — atomic release swap (failure injection)
        run: bash tests/deploy/test_deploy_release_swap.sh

      # Failure-injection proof for scripts/deploy_verify_release_tree.sh,
      # the resolved-cwd + independent-SHA check every "verify running the
      # deployed tree" step in deploy.yml now shares. Added after the
      # 2026-09-22 incident where the grid-api verify step's literal
      # `$cwd = $DEPLOY_PATH` comparison could never pass again once
      # deploy_release_swap.sh made $DEPLOY_PATH a symlink -- it failed a
      # genuinely healthy deploy. See
      # tests/deploy/test_deploy_verify_release_tree.sh's own header for what
      # each case proves.
      - name: Deploy pipeline — release-tree verification (failure injection)
        run: bash tests/deploy/test_deploy_verify_release_tree.sh

      # Failure-injection proof for scripts/deploy_pin_candidate_sha.sh:
      # `main` advancing during a build must not change the commit a
      # candidate is built from, or -- via the real
      # scripts/deploy_release_swap.sh -- the commit that ends up live. See
      # tests/deploy/test_deploy_pin_candidate_sha.sh's own header for what
      # each case proves.
      - name: Deploy pipeline — build-time exact-SHA pinning (failure injection)
        run: bash tests/deploy/test_deploy_pin_candidate_sha.sh
