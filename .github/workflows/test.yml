name: GRID Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: grid
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: griddb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        env:
          DB_URL: postgresql://grid:testpass@localhost:5432/griddb_test
          GRID_JWT_SECRET: test-secret-ci
          TESTING: "true"
        run: |
          python -m pytest tests/ -v --tb=short --co -q 2>/dev/null | head -20
          python -m pytest tests/ -v --tb=short -x --timeout=60 2>&1 | tail -30

      - name: Check for SQL injection patterns
        run: |
          echo "Checking for unsafe SQL patterns..."
          if grep -rn '\.format(' api/ store/ intelligence/ --include="*.py" | grep -i "select\|insert\|update\|delete\|where" | grep -v "# safe" | grep -v test; then
            echo "WARNING: Possible SQL injection patterns found (review above)"
          else
            echo "No SQL injection patterns detected"
          fi

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        working-directory: pwa
        run: npm ci

      - name: TypeScript check
        working-directory: pwa
        run: npx tsc --noEmit 2>&1 || true  # Non-blocking during migration

      - name: Build
        working-directory: pwa
        run: npm run build

      - name: Check bundle size
        working-directory: pwa
        run: |
          echo "Bundle size report:"
          du -sh dist/ 2>/dev/null || du -sh ../pwa_dist/ 2>/dev/null || echo "No dist found"
          find dist/ -name "*.js" -exec ls -lh {} \; 2>/dev/null | sort -k5 -h | tail -10 || true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff bandit

      - name: Ruff lint
        run: ruff check . --select E,W,F --ignore E501 --exit-zero

      - name: Security scan
        run: bandit -r api/ store/ intelligence/ -ll --exit-zero
